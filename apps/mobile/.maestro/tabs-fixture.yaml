appId: ${APP_ID}
name: Fixture tabs and details
---
# react-native-screens 4.26.2 writes tab testIDs to View.tag (Espresso),
# not UIAutomator resource IDs. Keep Trigger IDs and scope short tab labels
# to the native Material tab container containing that label; no tab indices.
# https://github.com/software-mansion/react-native-screens/blob/4.26.2/android/src/main/java/com/swmansion/rnscreens/gamma/tabs/host/TabsHostA11yCoordinator.kt
# The label also makes the parent unique: childOf resolves one matching parent.

# Home: open a loaded fixture Agent from the overview card.
# Wait for loaded fixture data and visual idle before navigation. Cold Android
# taps still failed after these checks and with retryTapIfNoChange's one retry.
# Bound attempts to three while the original card remains visible, then require
# the loaded detail header; unrelated hierarchy changes cannot satisfy the test.
# https://docs.maestro.dev/reference/commands-available/waitforanimationtoend
# https://docs.maestro.dev/reference/commands-available/repeat
- waitForAnimationToEnd
- repeat:
    times: 3
    while:
      visible:
        id: agent-card-c1a0de00-0001-4c00-8000-000000000001
    commands:
      - tapOn:
          id: agent-card-c1a0de00-0001-4c00-8000-000000000001
- extendedWaitUntil:
    visible:
      id: agent-detail-c1a0de00-0001-4c00-8000-000000000001
    timeout: 30000
- takeScreenshot: home-detail
- back
- tapOn:
    text: Overview
    childOf:
      id: ${APP_ID}:id/navigation_bar_item_content_container
      containsDescendants:
        - text: Overview
- assertVisible:
    id: overview-screen

# Agents: inventory and a different loaded fixture Agent detail.
- tapOn:
    text: Agents
    childOf:
      id: ${APP_ID}:id/navigation_bar_item_content_container
      containsDescendants:
        - text: Agents
- extendedWaitUntil:
    visible:
      id: agent-card-c0de0000-0002-4c00-8000-000000000002
    timeout: 30000
- takeScreenshot: agents
- tapOn:
    id: agent-card-c0de0000-0002-4c00-8000-000000000002
- assertVisible:
    id: agent-detail-c0de0000-0002-4c00-8000-000000000002
- takeScreenshot: agent-detail
- back

# Agent hub: hosted overview rows reach Web's Tools and Settings sections.
# Files offers the one-time browser handoff; CI cancels its native confirmation.
- scrollUntilVisible:
    element:
      id: agent-card-0c1a3000-0004-4c00-8000-000000000004
    timeout: 30000
- tapOn:
    id: agent-card-0c1a3000-0004-4c00-8000-000000000004
# Terminal is the last Tools row; scrolling to it keeps Files clear of the tab bar.
- scrollUntilVisible:
    element:
      id: agent-section-terminal
    timeout: 30000
- assertVisible:
    id: agent-section-files
- scrollUntilVisible:
    element:
      id: agent-section-settings
    timeout: 30000
- takeScreenshot: agent-hub
- tapOn:
    id: agent-section-files
- extendedWaitUntil:
    visible:
      text: Open Files
    timeout: 30000
- assertVisible:
    text: Use Terminal
- takeScreenshot: agent-files
- tapOn:
    text: Open Files
- extendedWaitUntil:
    visible:
      text: (?s)https://files\.example\.test.*
    timeout: 10000
- takeScreenshot: agent-files-confirmation
- tapOn:
    text: (?i)cancel
- assertNotVisible:
    text: (?s)https://files\.example\.test.*
- assertVisible:
    text: Open Files
- back
- back

# Sessions: loaded fixture inventory and an actual rendered transcript message.
- tapOn:
    text: Sessions
    childOf:
      id: ${APP_ID}:id/navigation_bar_item_content_container
      containsDescendants:
        - text: Sessions
- extendedWaitUntil:
    visible:
      id: session-card-5e550000-0001-4000-8000-000000000001
    timeout: 30000
- takeScreenshot: sessions
- tapOn:
    id: session-card-5e550000-0001-4000-8000-000000000001
- assertVisible:
    id: session-detail-5e550000-0001-4000-8000-000000000001
- assertVisible:
    id: session-transcript-5e550000-0001-4000-8000-000000000001
- scrollUntilVisible:
    element:
      id: session-message-0
    timeout: 30000
- assertVisible:
    id: session-message-0
- takeScreenshot: session-detail
- back

# Library: projects list and the loaded fixture project bundle.
- tapOn:
    text: Library
    childOf:
      id: ${APP_ID}:id/navigation_bar_item_content_container
      containsDescendants:
        - text: Library
- assertVisible:
    id: library-screen
- assertVisible:
    id: library-projects
- takeScreenshot: library
- tapOn:
    id: library-projects
- extendedWaitUntil:
    visible:
      id: project-card-a0f1c2d3-0002-4a00-8000-000000000002
    timeout: 30000
- tapOn:
    id: project-card-a0f1c2d3-0002-4a00-8000-000000000002
- assertVisible:
    id: project-detail-a0f1c2d3-0002-4a00-8000-000000000002
- takeScreenshot: project-detail
