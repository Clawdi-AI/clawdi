appId: ${MAESTRO_APP_ID}
name: Fixture tabs and details
---
# select-tab.yaml uses iOS tab testIDs and Android's scoped Material tab labels.

# Home: open a loaded fixture Agent from the overview card.
- tapOn:
    id: agent-card-c1a0de00-0001-4c00-8000-000000000001
- extendedWaitUntil:
    visible:
      id: agent-detail-c1a0de00-0001-4c00-8000-000000000001
    timeout: 30000
- takeScreenshot: home-detail
- runFlow: navigate-back.yaml
- runFlow:
    file: select-tab.yaml
    env:
      TAB_LABEL: Overview
      TAB_ID: overview
- assertVisible:
    id: overview-screen

# Agents: inventory and a different loaded fixture Agent detail.
- runFlow:
    file: select-tab.yaml
    env:
      TAB_LABEL: Agents
      TAB_ID: agents
- extendedWaitUntil:
    visible:
      id: agent-card-c0de0000-0002-4c00-8000-000000000002
    timeout: 30000
- takeScreenshot: agents
- tapOn:
    id: agent-card-c0de0000-0002-4c00-8000-000000000002
- assertVisible:
    id: agent-detail-c0de0000-0002-4c00-8000-000000000002
- takeScreenshot: agent-detail
- runFlow: navigate-back.yaml

# Agent hub: hosted overview rows reach Web's Tools and Settings sections.
# Files offers the one-time browser handoff; CI cancels its native confirmation.
- scrollUntilVisible:
    element:
      id: agent-card-0c1a3000-0004-4c00-8000-000000000004
    timeout: 30000
- tapOn:
    id: agent-card-0c1a3000-0004-4c00-8000-000000000004
# Terminal is the last Tools row; scrolling to it keeps Files clear of the tab bar.
- scrollUntilVisible:
    element:
      id: agent-section-terminal
    timeout: 30000
- assertVisible:
    id: agent-section-files
- scrollUntilVisible:
    element:
      id: agent-section-settings
    timeout: 30000
- takeScreenshot: agent-hub
- tapOn:
    id: agent-section-files
- extendedWaitUntil:
    visible:
      text: Open Files
    timeout: 30000
- assertVisible:
    text: Use Terminal
- takeScreenshot: agent-files
- tapOn:
    text: Open Files
- extendedWaitUntil:
    visible:
      text: (?s)https://files\.example\.test.*
    timeout: 10000
- takeScreenshot: agent-files-confirmation
- tapOn:
    text: (?i)cancel
- assertNotVisible:
    text: (?s)https://files\.example\.test.*
- assertVisible:
    text: Open Files
- runFlow: navigate-back.yaml
- runFlow: navigate-back.yaml

# Sessions: loaded fixture inventory and an actual rendered transcript message.
- runFlow:
    file: select-tab.yaml
    env:
      TAB_LABEL: Sessions
      TAB_ID: sessions
- extendedWaitUntil:
    visible:
      id: session-card-5e550000-0001-4000-8000-000000000001
    timeout: 30000
- takeScreenshot: sessions
- tapOn:
    id: session-card-5e550000-0001-4000-8000-000000000001
- assertVisible:
    id: session-detail-5e550000-0001-4000-8000-000000000001
- assertVisible:
    id: session-transcript-5e550000-0001-4000-8000-000000000001
- scrollUntilVisible:
    element:
      id: session-message-0
    timeout: 30000
- assertVisible:
    id: session-message-0
- takeScreenshot: session-detail
- runFlow: navigate-back.yaml

# Library: projects list and the loaded fixture project bundle.
- runFlow:
    file: select-tab.yaml
    env:
      TAB_LABEL: Library
      TAB_ID: library
- assertVisible:
    id: library-screen
- assertVisible:
    id: library-projects
- takeScreenshot: library
- tapOn:
    id: library-projects
- extendedWaitUntil:
    visible:
      id: project-card-a0f1c2d3-0002-4a00-8000-000000000002
    timeout: 30000
- tapOn:
    id: project-card-a0f1c2d3-0002-4a00-8000-000000000002
- assertVisible:
    id: project-detail-a0f1c2d3-0002-4a00-8000-000000000002
- takeScreenshot: project-detail
