appId: ${MAESTRO_APP_ID}
name: Account settings and fixture API keys
---
# select-tab.yaml handles each platform's native tab accessibility.
- runFlow:
    file: select-tab.yaml
    env:
      TAB_LABEL: Account
      TAB_ID: account
# The Account tab root is the native settings menu; rows push `/settings/<panel>`.
# @expo/ui exports row testIDs through SwiftUI accessibility or Compose IDs.
# https://github.com/expo/expo/blob/sdk-57/packages/expo-ui/android/src/main/java/expo/modules/ui/Modifiers.kt
- extendedWaitUntil:
    visible:
      id: settings-row-general
    timeout: 30000
- assertVisible:
    id: settings-row-account
- assertVisible:
    text: avery@clawdi.dev
- assertVisible:
    id: settings-row-api-keys
# The fixture configures a compute API, so the hosted rows are present.
- assertVisible:
    id: settings-row-wallet
- assertVisible:
    id: settings-row-compute
- assertVisible:
    id: settings-row-usage
- takeScreenshot: settings-menu
- tapOn:
    id: settings-row-usage
# The chart's peak label renders only once the fixture usage summary loads.
- extendedWaitUntil:
    visible:
      text: "Peak .*"
    timeout: 30000
- assertVisible:
    text: Spend over time
- takeScreenshot: settings-usage
- runFlow: navigate-back.yaml
- tapOn:
    id: settings-row-general
- assertVisible:
    id: settings-general
- assertVisible:
    id: settings-appearance
- takeScreenshot: settings
- runFlow: navigate-back.yaml
- tapOn:
    id: settings-row-api-keys
- extendedWaitUntil:
    visible:
      id: api-key-a9100000-0001-4000-8000-000000000001
    timeout: 30000
- assertVisible:
    id: api-key-a9100000-0002-4000-8000-000000000002
- takeScreenshot: api-keys
- runFlow: navigate-back.yaml
# Help and legal rows (Web's Help menu, Privacy Policy and Terms) close the menu.
- scrollUntilVisible:
    element:
      id: settings-row-terms
    direction: DOWN
- assertVisible:
    id: settings-row-docs
- assertVisible:
    id: settings-row-support
- assertVisible:
    id: settings-row-telegram
- assertVisible:
    id: settings-row-privacy
- takeScreenshot: settings-help
