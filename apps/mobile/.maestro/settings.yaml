appId: ${APP_ID}
name: Account settings and fixture API keys
---
# react-native-screens 4.26.2 writes tab testIDs to View.tag (Espresso),
# not UIAutomator resource IDs. Keep Trigger IDs and scope short tab labels
# to the native Material tab container containing that label; no tab indices.
# https://github.com/software-mansion/react-native-screens/blob/4.26.2/android/src/main/java/com/swmansion/rnscreens/gamma/tabs/host/TabsHostA11yCoordinator.kt
- tapOn:
    text: Account
    childOf:
      id: ${APP_ID}:id/navigation_bar_item_content_container
      containsDescendants:
        - text: Account
# The Account tab root is the native settings menu; rows push `/settings/<panel>`.
# @expo/ui's Compose testID modifier exports each row's tag as a resource ID.
# https://github.com/expo/expo/blob/sdk-57/packages/expo-ui/android/src/main/java/expo/modules/ui/Modifiers.kt
- extendedWaitUntil:
    visible:
      id: settings-row-general
    timeout: 30000
- assertVisible:
    id: settings-row-account
- assertVisible:
    id: settings-row-api-keys
- takeScreenshot: settings-menu
- tapOn:
    id: settings-row-general
- assertVisible:
    id: settings-general
- assertVisible:
    id: settings-user-name
    text: Avery Chen
- assertVisible:
    id: settings-user-email
    text: avery@clawdi.dev
- assertVisible:
    id: settings-appearance
- takeScreenshot: settings
- back
- tapOn:
    id: settings-row-api-keys
- extendedWaitUntil:
    visible:
      id: api-key-a9100000-0001-4000-8000-000000000001
    timeout: 30000
- assertVisible:
    id: api-key-a9100000-0002-4000-8000-000000000002
- takeScreenshot: api-keys
