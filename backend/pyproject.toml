[tool.deptry]
known_first_party = ["app"]
extend_exclude = ["alembic/"]

# `pydantic` and `starlette` are pulled in transitively via
# fastapi / pydantic-settings; we import them directly in many
# places without declaring them. Whitelist for now — promote to
# direct deps if the transitive chain ever changes upstream.
[tool.deptry.per_rule_ignores]
DEP003 = ["pydantic", "starlette"]
# DEP002 = "declared but not imported." These are runtime
# infrastructure — used via SQLAlchemy/FastAPI/CLI, not
# imported by name in app/. Removing them would actually
# break the runtime, so silence the noise.
DEP002 = [
    "uvicorn",            # ASGI server runtime; invoked as a binary.
    "asyncpg",            # SQLAlchemy postgresql+asyncpg driver.
    "alembic",            # Migration CLI.
    "httpcore",           # Pinned transport behavior used by HTTPX request extensions.
    "python-multipart",   # FastAPI multipart parser; loaded via Form().
    "aiofiles",           # FastAPI's UploadFile uses async file I/O internally.
    "psycopg2-binary",    # Sync PG driver kept for alembic offline-mode SQL.
    "mem0ai",             # Optional untyped SDK; loaded by the narrow Mem0 adapter at runtime.
    "tzdata",             # IANA database loaded indirectly by the stdlib zoneinfo module.
]

# `app/services/memory_provider_mem0.py` imports `mem0` only inside
# its lazy resolution boundary, gated on the `[mem0]` production extra.
[tool.deptry.package_module_name_map]
mem0ai = "mem0"

[tool.pdm.scripts]
dev = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
start = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
channels-worker = "python -m app.workers.channels"
migrate = "alembic upgrade head"
audit-ai-provider-models = "python -m scripts.audit_ai_provider_models"
lint = "ruff check ."
format = "ruff format ."
typecheck = "uv run --extra mem0 python scripts/type_governance.py owned"
type-inventory = "uv run --extra mem0 python scripts/type_governance.py inventory"
test = { shell = "../scripts/test.sh backend" }

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
strict_config = true
strict_markers = true
testpaths = ["tests"]
markers = [
    "committed_db: use real commits for independent-connection or concurrency behavior",
]
filterwarnings = [
    # asyncpg emits these on some platforms — harmless.
    "ignore::DeprecationWarning:asyncpg",
]
