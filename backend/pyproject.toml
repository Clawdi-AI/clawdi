[project]
name = "clawdi-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.14.0",
    "pyjwt[crypto]==2.13.0",
    "cryptography>=44.0",
    "httpx>=0.28.1",
    "httpx2>=2.5.0,<3.0.0",
    "idna>=3.10",
    "python-multipart>=0.0.20",
    "aiofiles>=24.1",
    "psycopg2-binary>=2.9.11",
    "pgvector>=0.2.5",
    "openai>=2.52.0",
    "fastembed>=0.3",
    "sentry-sdk[fastapi]==2.66.1",
    # https://pypi.org/pypi/websockets/17.0.1/json
    "websockets==17.0.1",
    "pyyaml>=6.0",
    # Keep the published pair exact: PyPI composio 0.18.1 metadata pins
    # composio-client 1.43.0. https://pypi.org/pypi/composio/0.18.1/json
    "composio==0.18.1",
    "composio-client==1.43.0",
    # Official Streamable HTTP client lifecycle for Composio Tool Router.
    "mcp==2.0.0",
    "prometheus-client>=0.25.0",
    # Keep boto3 and botocore on the same published release. boto3 1.43.62
    # requires botocore>=1.43.62,<1.44.0.
    # https://pypi.org/pypi/boto3/1.43.62/json
    "boto3==1.43.62",
    "botocore==1.43.62",
]

[project.optional-dependencies]
# Mem0 SaaS-backed memory provider. Optional because most
# self-hosters use the builtin pgvector provider and mem0ai
# pulls a heavy transitive dep tree. Enable per deployment
# with `uv pip install -e ".[mem0]"`. The `Mem0Provider`
# class lazy-imports `mem0`, and `get_memory_provider` falls
# back to the builtin provider with a warning when the import
# fails — so this extra controls whether mem0 is *available*,
# not whether memories work at all.
mem0 = ["mem0ai>=0.1"]

[dependency-groups]
dev = [
    "basedpyright==1.39.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.9",
    # Catch "import declared in code but not in deps" drift —
    # the same class of bug that let mem0/mem0ai stay
    # undeclared for months without CI noticing.
    "deptry>=0.20",
]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = [
    "app/core/auth.py",
    "app/core/logging_config.py",
    "app/core/query_utils.py",
    "app/core/sentry.py",
    "app/core/skill_key.py",
    "app/middleware/request_timing.py",
    "app/routes/ai_providers.py",
    "app/routes/channel_routers/telegram.py",
    "app/routes/channel_routers/whatsapp.py",
    "app/routes/dashboard.py",
    "app/routes/sharing.py",
    "app/routes/sync.py",
    "app/routes/vault.py",
    "app/schemas/ai_provider.py",
    "app/services/agent_bindings.py",
    "app/services/agent_environments.py",
    "app/services/ai_provider_connection.py",
    "app/services/ai_provider_credentials.py",
    "app/services/channel_debug_events.py",
    "app/services/channel_webhooks.py",
    "app/services/composio.py",
    "app/services/discord_gateway_worker.py",
    "app/services/embedding.py",
    "app/services/file_store.py",
    "app/services/file_store_s3.py",
    "app/services/memory_extraction.py",
    "app/services/private_ip.py",
    "app/services/runtime_observation.py",
    "app/services/session_content.py",
    "app/services/sync_events.py",
    "app/services/tar_utils.py",
    "app/services/whatsapp_baileys.py",
    "app/services/whatsapp_native_transport.py",
    "app/services/whatsapp_noise.py",
    "app/services/whatsapp_provider_bridge.py",
    "app/services/whatsapp_runtime_types.py",
    "app/services/whatsapp_sidecar_registry.py",
]
strict = [
    "app/core/logging_config.py",
    "app/core/query_utils.py",
    "app/core/skill_key.py",
    "app/middleware/request_timing.py",
    "app/routes/sharing.py",
    "app/routes/sync.py",
    "app/services/agent_bindings.py",
    "app/services/ai_provider_connection.py",
    "app/services/ai_provider_credentials.py",
    "app/services/channel_debug_events.py",
    "app/services/channel_webhooks.py",
    "app/services/discord_gateway_worker.py",
    "app/services/embedding.py",
    "app/services/file_store.py",
    "app/services/memory_extraction.py",
    "app/services/private_ip.py",
    "app/services/runtime_observation.py",
    "app/services/session_content.py",
    "app/services/tar_utils.py",
    "app/services/whatsapp_native_transport.py",
    "app/services/whatsapp_provider_bridge.py",
    "app/services/whatsapp_runtime_types.py",
    "app/services/whatsapp_sidecar_registry.py",
]

[tool.deptry]
known_first_party = ["app"]
extend_exclude = ["alembic/"]

# `pydantic` and `starlette` are pulled in transitively via
# fastapi / pydantic-settings; we import them directly in many
# places without declaring them. Whitelist for now — promote to
# direct deps if the transitive chain ever changes upstream.
[tool.deptry.per_rule_ignores]
DEP003 = ["pydantic", "starlette"]
# DEP002 = "declared but not imported." These are runtime
# infrastructure — used via SQLAlchemy/FastAPI/CLI, not
# imported by name in app/. Removing them would actually
# break the runtime, so silence the noise.
DEP002 = [
    "uvicorn",            # ASGI server runtime; invoked as a binary.
    "asyncpg",            # SQLAlchemy postgresql+asyncpg driver.
    "alembic",            # Migration CLI.
    "python-multipart",   # FastAPI multipart parser; loaded via Form().
    "aiofiles",           # FastAPI's UploadFile uses async file I/O internally.
    "psycopg2-binary",    # Sync PG driver kept for alembic offline-mode SQL.
]

# `app/services/memory_provider.py` imports `mem0` only inside
# `Mem0Provider.__init__`, gated on the `[mem0]` extra. Without
# this mapping deptry DEP001 fires on any install that omits the
# extra (the default).
[tool.deptry.package_module_name_map]
mem0ai = "mem0"

[tool.pdm.scripts]
dev = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
start = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
channels-worker = "python -m app.workers.channels"
migrate = "alembic upgrade head"
audit-ai-provider-models = "python -m scripts.audit_ai_provider_models"
lint = "ruff check ."
format = "ruff format ."
typecheck = "python scripts/type_governance.py owned"
type-inventory = "python scripts/type_governance.py inventory"
test = { shell = "../scripts/test.sh backend" }

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
strict_config = true
strict_markers = true
testpaths = ["tests"]
markers = [
    "committed_db: use real commits for independent-connection or concurrency behavior",
]
filterwarnings = [
    # asyncpg emits these on some platforms — harmless.
    "ignore::DeprecationWarning:asyncpg",
]
