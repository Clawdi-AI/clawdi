[project]
name = "clawdi-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg==0.31.0",
    "alembic>=1.14",
    "pydantic-settings>=2.14.0",
    "pyjwt[crypto]==2.13.0",
    "cryptography>=44.0",
    # SafePublicHttpClient relies on request extension forwarding and
    # sni_hostname handling verified in these exact paired releases.
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "httpx2>=2.5.0,<3.0.0",
    "idna>=3.10",
    "python-multipart>=0.0.20",
    "aiofiles>=24.1",
    "psycopg2-binary>=2.9.11",
    "pgvector>=0.2.5",
    "openai>=2.52.0",
    "fastembed>=0.3",
    "sentry-sdk[fastapi]==2.66.1",
    # https://pypi.org/pypi/websockets/17.0.1/json
    "websockets==17.0.1",
    "pyyaml>=6.0",
    # Keep the published pair exact: PyPI composio 0.18.1 metadata pins
    # composio-client 1.43.0. https://pypi.org/pypi/composio/0.18.1/json
    "composio==0.18.1",
    "composio-client==1.43.0",
    # Official Streamable HTTP client lifecycle for Composio Tool Router.
    "mcp==2.0.0",
    "prometheus-client>=0.25.0",
    # Keep the runtime and generated typing distributions on their latest
    # common public patch. https://pypi.org/pypi/boto3/1.43.14/json
    "boto3==1.43.14",
    "botocore==1.43.14",
    "xeddsa==1.2.0",
    # ZoneInfo fallback for slim production images without system zoneinfo.
    "tzdata==2026.3",
]

[project.optional-dependencies]
# Mem0 SaaS-backed memory provider. Optional because most
# self-hosters use the builtin pgvector provider and mem0ai
# pulls a heavy transitive dep tree. Enable per deployment
# with `uv pip install -e ".[mem0]"`. The `Mem0Provider`
# class lazy-imports `mem0`, and `get_memory_provider` falls
# back to the builtin provider with a warning when the import
# fails — so this extra controls whether mem0 is *available*,
# not whether memories work at all.
mem0 = ["mem0ai==2.0.14"]

[dependency-groups]
dev = [
    "basedpyright==1.39.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.9",
    # Catch "import declared in code but not in deps" drift —
    # the same class of bug that let mem0/mem0ai stay
    # undeclared for months without CI noticing.
    "deptry>=0.20",
    # Generated from boto3/botocore service models and pinned to the runtime
    # SDK line. The full bundle resolves every generated client overload for
    # strict Pyright consumers; the base stubs own boto3's public surface.
    "boto3-stubs==1.43.14",
    "boto3-stubs-full==1.43.14",
    "botocore-stubs==1.43.14",
    # Public annotations for the pinned asyncpg 0.31 runtime contract.
    "asyncpg-stubs==0.31.3",
]

