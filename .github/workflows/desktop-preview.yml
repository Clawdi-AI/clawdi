name: Desktop Preview

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/cli/package.json"
      - "packages/shared/**"
      - "package.json"
      - "bun.lock"
      - ".github/actions/setup-bun-ci/**"
      - ".github/workflows/desktop-preview.yml"

permissions:
  contents: read
  deployments: read

concurrency:
  group: desktop-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-bun-ci

      - name: Resolve the matching Web preview
        id: web-preview
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.payload.pull_request.head.sha;
            for (let attempt = 0; attempt < 40; attempt += 1) {
              const deployments = await github.rest.repos.listDeployments({
                owner,
                repo,
                ref,
                environment: "Preview",
                per_page: 10,
              });
              for (const deployment of deployments.data) {
                const statuses = await github.rest.repos.listDeploymentStatuses({
                  owner,
                  repo,
                  deployment_id: deployment.id,
                  per_page: 10,
                });
                const ready = statuses.data.find(
                  (status) => status.state === "success" && status.environment_url,
                );
                if (ready?.environment_url) {
                  core.setOutput("url", ready.environment_url);
                  return;
                }
              }
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }
            core.setFailed("The matching Web preview was not ready within ten minutes.");

      - name: Build unsigned preview DMG
        env:
          PREVIEW_WEB_URL: ${{ steps.web-preview.outputs.url }}
        run: |
          bun run --cwd apps/desktop build
          CLAWDI_NATIVE_TARGET=darwin-arm64 bun run --cwd apps/desktop prepare:native
          bun x electron-builder \
            --projectDir apps/desktop \
            --mac dmg \
            --arm64 \
            --config.extraMetadata.clawdiWebUrl="$PREVIEW_WEB_URL"
          cd apps/desktop/release
          dmg=(Clawdi-*.dmg)
          test "${#dmg[@]}" -eq 1
          shasum -a 256 "${dmg[0]}" > "${dmg[0]}.sha256"

      - name: Upload unsigned preview
        uses: actions/upload-artifact@v7
        with:
          name: clawdi-macos-arm64-unsigned-preview
          path: |
            apps/desktop/release/Clawdi-*.dmg
            apps/desktop/release/Clawdi-*.dmg.sha256
          if-no-files-found: error
          retention-days: 7
