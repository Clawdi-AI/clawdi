name: Desktop Preview

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/cli/package.json"
      - "packages/shared/**"
      - "package.json"
      - "bun.lock"
      - ".github/actions/setup-bun-ci/**"
      - ".github/workflows/desktop-preview.yml"

permissions:
  contents: read

concurrency:
  group: desktop-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-bun-ci

      - name: Verify Desktop
        run: |
          bun run --cwd apps/desktop typecheck
          bun run --cwd apps/desktop test:internal
          bun x biome ci apps/desktop packages/shared/src/desktop.ts

      - name: Build ad-hoc signed preview DMG
        run: |
          bun run --cwd apps/desktop build
          CLAWDI_NATIVE_TARGET=darwin-arm64 bun run --cwd apps/desktop prepare:native
          CSC_FOR_PULL_REQUEST=true bun x electron-builder \
            --projectDir apps/desktop \
            --mac dmg \
            --arm64 \
            --config.mac.identity=- \
            --config.mac.hardenedRuntime=false
          cd apps/desktop/release
          dmg=(Clawdi-*.dmg)
          test "${#dmg[@]}" -eq 1
          dmg_path="$PWD/${dmg[0]}"
          mount="$RUNNER_TEMP/clawdi-dmg"
          runtime_home="$RUNNER_TEMP/clawdi-runtime"
          mkdir -p "$mount" "$runtime_home/home" "$runtime_home/state"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "${dmg[0]}"
          trap 'hdiutil detach "$mount"' EXIT
          ditto "$mount/Clawdi.app" "$runtime_home/Clawdi.app"
          hdiutil detach "$mount"
          trap - EXIT
          bun x @electron/fuses read --app "$runtime_home/Clawdi.app"
          cli="$runtime_home/Clawdi.app/Contents/Resources/native/clawdi"
          test -x "$cli"
          file "$cli" | grep -q "arm64"
          codesign --verify --deep --strict --verbose=2 "$runtime_home/Clawdi.app"
          codesign --verify --strict --verbose=2 "$cli"
          codesign -dv --verbose=4 "$runtime_home/Clawdi.app" 2>&1 | grep -q '^Signature=adhoc$'
          HOME="$runtime_home/home" CLAWDI_HOME="$runtime_home/state" \
            "$cli" update --native-identity
          HOME="$runtime_home/home" CLAWDI_HOME="$runtime_home/state" \
            "$cli" auth status --json
          HOME="$runtime_home/home" CLAWDI_HOME="$runtime_home/state" \
            "$cli" daemon doctor --json
          node ../scripts/smoke-packaged.mjs \
            "$runtime_home/Clawdi.app/Contents/MacOS/Clawdi" \
            "$runtime_home/install-smoke" \
            install
          cd "$GITHUB_WORKSPACE"
          smoke_local_url="http://127.0.0.1:17891"
          smoke_ready_file="$RUNNER_TEMP/clawdi-dashboard-ready"
          smoke_server_log="$RUNNER_TEMP/clawdi-dashboard-server.log"
          tunnel_log="$RUNNER_TEMP/clawdi-dashboard-tunnel.log"
          node apps/desktop/scripts/dashboard-smoke-server.mjs \
            "$smoke_local_url" \
            "$smoke_ready_file" >"$smoke_server_log" 2>&1 &
          smoke_server_pid=$!
          cleanup_dashboard_smoke() {
            if [ -n "${tunnel_pid:-}" ]; then
              kill "$tunnel_pid" 2>/dev/null || true
              wait "$tunnel_pid" 2>/dev/null || true
            fi
            kill "$smoke_server_pid" 2>/dev/null || true
            wait "$smoke_server_pid" 2>/dev/null || true
          }
          finish_dashboard_smoke() {
            status=$?
            if [ -n "${production_cli:-}" ] && [ -f "$production_cli" ]; then
              cp "$production_cli" "$native_cli"
            fi
            cleanup_dashboard_smoke
            if [ "$status" -ne 0 ]; then
              cat "$smoke_server_log"
              if [ -f "$tunnel_log" ]; then cat "$tunnel_log"; fi
            fi
            trap - EXIT
            exit "$status"
          }
          trap finish_dashboard_smoke EXIT
          curl -fsSL \
            -o "$RUNNER_TEMP/cloudflared.tgz" \
            https://github.com/cloudflare/cloudflared/releases/download/2026.8.2/cloudflared-darwin-arm64.tgz
          echo "9042c2c5d8b2de78e60f313d5fb31b6c5c1cebde787a3caf1f2c9588084ac442  $RUNNER_TEMP/cloudflared.tgz" \
            | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/cloudflared.tgz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/cloudflared" tunnel \
            --no-autoupdate \
            --url "$smoke_local_url" >"$tunnel_log" 2>&1 &
          tunnel_pid=$!
          smoke_web_url=""
          smoke_web_address=""
          for _ in {1..60}; do
            smoke_web_url=$(sed -nE \
              's#.*(https://[a-z0-9-]+\.trycloudflare\.com).*#\1#p' \
              "$tunnel_log" | head -n 1)
            if [ -n "$smoke_web_url" ]; then
              smoke_web_host=$(node -p 'new URL(process.argv[1]).hostname' "$smoke_web_url")
              smoke_web_address=$(dig +short @1.1.1.1 "$smoke_web_host" A \
                | sed -nE '/^([0-9]{1,3}\.){3}[0-9]{1,3}$/p' \
                | head -n 1)
            fi
            if [ -n "$smoke_web_address" ] && curl -fsS \
              --resolve "$smoke_web_host:443:$smoke_web_address" \
              "$smoke_web_url/health" >/dev/null; then
              break
            fi
            sleep 1
          done
          test -n "$smoke_web_url" -a -n "$smoke_web_address"
          curl -fsS \
            --resolve "$smoke_web_host:443:$smoke_web_address" \
            "$smoke_web_url/health" >/dev/null
          smoke_output="$RUNNER_TEMP/clawdi-smoke-build"
          native_cli="apps/desktop/resources/native/clawdi"
          production_cli="$RUNNER_TEMP/clawdi-production-cli"
          cp "$native_cli" "$production_cli"
          cp apps/desktop/scripts/fake-native-smoke.sh "$native_cli"
          chmod +x "$native_cli"
          CSC_FOR_PULL_REQUEST=true bun x electron-builder \
            --projectDir apps/desktop \
            --mac dir \
            --arm64 \
            --config.directories.output="$smoke_output" \
            --config.extraMetadata.clawdiWebUrl="$smoke_web_url" \
            --config.mac.identity=- \
            --config.mac.hardenedRuntime=false
          cp "$production_cli" "$native_cli"
          dashboard_app="$runtime_home/Applications/Clawdi.app"
          mkdir -p "$(dirname "$dashboard_app")"
          ditto "$smoke_output/mac-arm64/Clawdi.app" "$dashboard_app"
          codesign --verify --deep --strict --verbose=2 "$dashboard_app"
          metadata_dir="$RUNNER_TEMP/clawdi-smoke-metadata"
          mkdir -p "$metadata_dir"
          (
            cd "$metadata_dir"
            bun x @electron/asar extract-file \
              "$dashboard_app/Contents/Resources/app.asar" \
              package.json
            test "$(node -p 'require("./package.json").clawdiWebUrl')" = "$smoke_web_url"
          )
          node apps/desktop/scripts/smoke-packaged.mjs \
            "$dashboard_app/Contents/MacOS/Clawdi" \
            "$runtime_home/dashboard-smoke" \
            dashboard \
            "$smoke_web_url" \
            "$smoke_ready_file" \
            "$smoke_web_address"
          cleanup_dashboard_smoke
          trap - EXIT
          cd "$(dirname "$dmg_path")"
          shasum -a 256 "${dmg[0]}" > "${dmg[0]}.sha256"

      - name: Upload ad-hoc signed preview
        uses: actions/upload-artifact@v7
        with:
          name: clawdi-macos-arm64-ad-hoc-preview
          path: |
            apps/desktop/release/Clawdi-*.dmg
            apps/desktop/release/Clawdi-*.dmg.sha256
          if-no-files-found: error
          retention-days: 7
