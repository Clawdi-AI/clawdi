name: Desktop Signed Preview

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: desktop-signed-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'desktop-signing' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-ci
      - name: Typecheck
        run: |
          bun run --cwd apps/desktop typecheck
          bun run --cwd apps/web typecheck

  macos-arm64:
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'desktop-signing' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            bundle: mac-arm64
          - runner: macos-15-intel
            arch: x64
            bundle: mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-bun-ci

      - name: Verify Desktop
        run: |
          bun run --cwd apps/desktop test:internal

      - name: Package and notarize preview
        shell: bash
        env:
          CSC_FOR_PULL_REQUEST: 'true'
          CLAWDI_DESKTOP_VERSION: 0.0.0-beta.0
          CLAWDI_DESKTOP_ARCH: ${{ matrix.arch }}
          CLAWDI_DESKTOP_UPDATE_CHANNEL: beta
          CLAWDI_DESKTOP_UPDATE_FEED_URL: https://example.invalid/clawdi/desktop/darwin-${{ matrix.arch }}/
          APP_BUNDLE_DIRECTORY: ${{ matrix.bundle }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for name in APPLE_API_KEY_CONTENT APPLE_API_KEY_ID APPLE_API_ISSUER; do
            test -n "${!name}" || { echo "Missing secret: $name"; exit 1; }
          done
          umask 077
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
          unset APPLE_API_KEY_CONTENT
          bun run --cwd apps/desktop package:release
          app="apps/desktop/release/$APP_BUNDLE_DIRECTORY/Clawdi.app"
          cli="$app/Contents/Resources/native/clawdi"
          mkdir -p "$RUNNER_TEMP/signed-preview-home" "$RUNNER_TEMP/signed-preview-state"
          HOME="$RUNNER_TEMP/signed-preview-home" CLAWDI_HOME="$RUNNER_TEMP/signed-preview-state" \
            "$cli" update --native-identity
          node apps/desktop/scripts/smoke-packaged.mjs \
            "$PWD/$app/Contents/MacOS/Clawdi" "$RUNNER_TEMP/signed-preview-smoke" install
          cd apps/desktop/release
          shasum -a 256 Clawdi-*.dmg Clawdi-*.zip > SHA256SUMS

      - name: Upload signed and notarized preview
        uses: actions/upload-artifact@v7
        with:
          name: clawdi-macos-${{ matrix.arch }}-signed-preview
          path: |
            apps/desktop/release/Clawdi-*.dmg
            apps/desktop/release/Clawdi-*.zip
            apps/desktop/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
