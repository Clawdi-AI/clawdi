name: Desktop Channel Build

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel
        type: choice
        options: [stable, beta]
        required: true
        default: beta
      version:
        description: Version matching channel (e.g. 0.1.0-beta.1)
        required: true
        type: string
      feed_url:
        description: Public HTTPS update directory ending in slash
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-channel-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-ci
      - name: Verify Desktop
        run: |
          bun run --cwd apps/desktop typecheck
          bun run --cwd apps/desktop test:internal
      - name: Build signed channel package
        env:
          CLAWDI_DESKTOP_VERSION: ${{ inputs.version }}
          CLAWDI_DESKTOP_UPDATE_CHANNEL: ${{ inputs.channel }}
          CLAWDI_DESKTOP_UPDATE_FEED_URL: ${{ inputs.feed_url }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          umask 077
          export APPLE_API_KEY="$RUNNER_TEMP/desktop-notarization.p8"
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
          unset APPLE_API_KEY_CONTENT
          bun run --cwd apps/desktop package:mac:release
          node apps/desktop/scripts/smoke-packaged.mjs \
            "$PWD/apps/desktop/release/mac-arm64/Clawdi.app/Contents/MacOS/Clawdi" \
            "$RUNNER_TEMP/desktop-channel-smoke" install
          cd apps/desktop/release
          shasum -a 256 Clawdi-*.dmg Clawdi-*.zip > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: clawdi-macos-arm64-${{ inputs.channel }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*-mac.yml
            apps/desktop/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
