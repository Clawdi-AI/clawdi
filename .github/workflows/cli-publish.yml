name: Publish Agent v2 CLI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/cli/**"
      - "install.sh"
      - ".github/workflows/cli-publish.yml"

concurrency:
  group: cli-publish
  cancel-in-progress: false

env:
  CLI_ARTIFACT_NAME: clawdi-cli-release

# This repository builds, verifies, and publishes one immutable artifact.
# Prereleases publish to beta; stable releases publish to latest.
jobs:
  build-immutable-artifact:
    runs-on: ${{ vars.CI_RUNNER || 'blacksmith-16vcpu-ubuntu-2404' }}
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      npm_tag: ${{ steps.check.outputs.npm_tag }}
      npm_action: ${{ steps.check.outputs.npm_action }}
      cli_tarball_filename: ${{ steps.check.outputs.cli_tarball_filename }}
      source_commit: ${{ steps.check.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Check whether the exact release needs completing
        id: check
        working-directory: packages/cli
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package_name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          tag="clawdi-cli-v$version"
          npm_exists=false
          published_integrity=""
          attestations=""
          attestation_bundle=""
          if npm view "clawdi@$version" version >/dev/null 2>&1; then
            npm_exists=true
            published_integrity=$(npm view "clawdi@$version" dist.integrity)
            attestations=$(npm view "clawdi@$version" dist.attestations --json)
            attestation_url=$(ATTESTATIONS="$attestations" node - <<'NODE'
          const attestations = JSON.parse(process.env.ATTESTATIONS);
          const url = new URL(attestations.url);
          if (url.origin !== "https://registry.npmjs.org") process.exit(1);
          console.log(attestations.url);
          NODE
            )
            attestation_bundle=""
            for attempt in $(seq 1 12); do
              if attestation_bundle=$(curl --fail --silent --location "$attestation_url"); then
                break
              fi
              if [ "$attempt" -lt 12 ]; then sleep 5; fi
            done
            if [ -z "$attestation_bundle" ]; then
              echo "clawdi@$version provenance was not visible after 60 seconds" >&2
              exit 69
            fi
          fi
          release_json=null
          if existing_release=$(gh release view "$tag" --json isDraft,targetCommitish,assets 2>/dev/null); then
            release_json="$existing_release"
          fi
          tag_commit=null
          if resolved_tag=$(git rev-list -n 1 "$tag" 2>/dev/null); then
            tag_commit="\"$resolved_tag\""
          fi
          recovery_input=$(PACKAGE_NAME="$package_name" VERSION="$version" NPM_EXISTS="$npm_exists" \
            PUBLISHED_INTEGRITY="$published_integrity" ATTESTATIONS="$attestations" \
            ATTESTATION_BUNDLE="$attestation_bundle" RELEASE_JSON="$release_json" \
            TAG_COMMIT="$tag_commit" node - <<'NODE'
          const npm = process.env.NPM_EXISTS === "true"
            ? {
                exists: true,
                distIntegrity: process.env.PUBLISHED_INTEGRITY,
                attestations: JSON.parse(process.env.ATTESTATIONS),
                attestationBundle: JSON.parse(process.env.ATTESTATION_BUNDLE),
              }
            : { exists: false };
          console.log(JSON.stringify({
            schemaVersion: "clawdi.cliReleaseRecoveryInput.v1",
            mode: "plan",
            package: { name: process.env.PACKAGE_NAME, version: process.env.VERSION },
            repository: {
              url: `https://github.com/${process.env.GITHUB_REPOSITORY}`,
              workflowPath: ".github/workflows/cli-publish.yml",
            },
            currentCommit: process.env.GITHUB_SHA,
            requiredAssets: [
              "clawdi-cli-linux-x64.tar.gz",
              "clawdi-cli-linux-arm64.tar.gz",
              "clawdi-cli-linux-x64-musl.tar.gz",
              "clawdi-cli-linux-arm64-musl.tar.gz",
              "clawdi-cli-darwin-x64.tar.gz",
              "clawdi-cli-darwin-arm64.tar.gz",
              "clawdi-cli-manifest.txt",
              "install.sh",
            ],
            npm,
            github: {
              release: JSON.parse(process.env.RELEASE_JSON),
              tagCommit: JSON.parse(process.env.TAG_COMMIT),
            },
          }));
          NODE
          )
          recovery=$(node scripts/release-recovery.mjs <<< "$recovery_input")
          RECOVERY="$recovery" node - <<'NODE'
          const fs = require("node:fs");
          const decision = JSON.parse(process.env.RECOVERY);
          const outputs = {
            should_release: decision.shouldRelease,
            version: decision.version,
            npm_tag: decision.npmTag,
            npm_action: decision.npmAction,
            cli_tarball_filename: decision.tarballFilename,
            source_commit: decision.sourceCommit,
          };
          fs.appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(outputs)
            .map(([key, value]) => `${key}=${value}\n`).join(""));
          NODE

      - name: Checkout immutable CLI source
        if: steps.check.outputs.should_release == 'true'
        env:
          SOURCE_COMMIT: ${{ steps.check.outputs.source_commit }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git cat-file -e "$SOURCE_COMMIT^{commit}"
          git checkout --detach "$SOURCE_COMMIT"
          test "$(node -p "require('./packages/cli/package.json').version")" = "$VERSION"

      - name: Install workspace dependencies
        if: steps.check.outputs.should_release == 'true'
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: steps.check.outputs.should_release == 'true'
        working-directory: packages/cli
        run: bun run typecheck

      - name: Test (ephemeral internal suite)
        if: steps.check.outputs.should_release == 'true'
        run: bun test --isolate --max-concurrency=1 packages/cli

      - name: Build package and native release matrix
        id: build_native_release
        if: steps.check.outputs.should_release == 'true'
        working-directory: packages/cli
        run: |
          bun run build
          bun run build:native-release
          ./dist-native/linux-x64/clawdi --version
          bun run check:native-release

      - name: Native lifecycle (ephemeral internal suite)
        if: steps.check.outputs.should_release == 'true'
        working-directory: packages/cli
        run: |
          CLAWDI_NATIVE_BINARY=dist-native/linux-x64/clawdi \
            bun test \
              tests/e2e/native-installer.e2e.test.ts \
              tests/e2e/native-daemon.e2e.test.ts

      - name: Pack and verify immutable release artifact
        id: pack_release
        if: steps.check.outputs.should_release == 'true'
        working-directory: packages/cli
        run: |
          sh -n ../../install.sh
          node scripts/check-publish-manifest.mjs
          release_dir="$RUNNER_TEMP/clawdi-cli-release"
          install_dir="$RUNNER_TEMP/clawdi-cli-install"
          mkdir -p "$release_dir" "$install_dir"
          pack_json=$(npm pack --json --ignore-scripts --pack-destination "$release_dir")
          tarball=$(node -e "const fs=require('node:fs'); const data=JSON.parse(fs.readFileSync(0,'utf8')); console.log(data[0].filename)" <<< "$pack_json")
          tarball_path="$release_dir/$tarball"
          tarball_sha=$(sha256sum "$tarball_path" | cut -d' ' -f1)
          printf '%s  %s\n' "$tarball_sha" "$tarball" > "$release_dir/$tarball.sha256"
          cp dist-release/clawdi-cli-*.tar.gz "$release_dir/"
          cp dist-release/clawdi-cli-manifest.txt "$release_dir/"
          cp ../../install.sh "$release_dir/"
          (cd "$release_dir" && sha256sum --check "$tarball.sha256")
          bun run scripts/check-native-release.mjs "$release_dir" "$(node -p "require('./package.json').version")"
          cd "$install_dir"
          npm init -y >/dev/null
          npm install "$tarball_path" --ignore-scripts --no-audit --no-fund
          "$install_dir/node_modules/.bin/clawdi" --version
          test -f "$install_dir/node_modules/clawdi/skills/clawdi/SKILL.md"
          test -f "$install_dir/node_modules/clawdi/skills/hosted-versions/1/clawdi/SKILL.md"
          test -f "$install_dir/node_modules/clawdi/egress-addon/clawdi_egress_addon.py"

      - name: Upload immutable CLI release artifact
        if: steps.check.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CLI_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/clawdi-cli-release/
          if-no-files-found: error
          retention-days: 7

  publish-immutable-artifact-with-oidc:
    if: needs['build-immutable-artifact'].outputs.should_release == 'true'
    needs: build-immutable-artifact
    # npm trusted publishing supports GitHub-hosted runners, not self-hosted runners.
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Checkout immutable CLI source for verification
        env:
          SOURCE_COMMIT: ${{ needs['build-immutable-artifact'].outputs.source_commit }}
          VERSION: ${{ needs['build-immutable-artifact'].outputs.version }}
        run: |
          git cat-file -e "$SOURCE_COMMIT^{commit}"
          git checkout --detach "$SOURCE_COMMIT"
          test "$(node -p "require('./packages/cli/package.json').version")" = "$VERSION"

      - name: Install immutable verification dependencies
        run: bun install --frozen-lockfile

      - name: Verify trusted publishing toolchain
        run: |
          npm install --global npm@11.5.1
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 22 || (major === 22 && minor < 14)) process.exit(1)'
          test "$(npm --version)" = "11.5.1"

      - name: Download immutable CLI release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CLI_ARTIFACT_NAME }}
          path: release

      - name: Verify release artifact
        id: verify_release
        env:
          VERSION: ${{ needs['build-immutable-artifact'].outputs.version }}
          CLI_TARBALL_FILENAME: ${{ needs['build-immutable-artifact'].outputs.cli_tarball_filename }}
        run: |
          cd release
          tarball="$CLI_TARBALL_FILENAME"
          test -s "$tarball"
          test -s "$tarball.sha256"
          test -s clawdi-cli-manifest.txt
          test -s install.sh
          for target in linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl darwin-x64 darwin-arm64; do
            test -s "clawdi-cli-$target.tar.gz"
          done
          sha256sum --check "$tarball.sha256"
          bun run ../packages/cli/scripts/check-native-release.mjs . "$VERSION"
          manifest=$(tar -xOf "$tarball" package/package.json)
          test "$(node -e "const fs=require('node:fs'); console.log(JSON.parse(fs.readFileSync(0,'utf8')).name)" <<< "$manifest")" = "clawdi"
          test "$(node -e "const fs=require('node:fs'); console.log(JSON.parse(fs.readFileSync(0,'utf8')).version)" <<< "$manifest")" = "$VERSION"

      - name: Publish or verify immutable tarball
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_TARBALL_FILENAME: ${{ needs['build-immutable-artifact'].outputs.cli_tarball_filename }}
          NPM_TAG: ${{ needs['build-immutable-artifact'].outputs.npm_tag }}
          NPM_ACTION: ${{ needs['build-immutable-artifact'].outputs.npm_action }}
          VERSION: ${{ needs['build-immutable-artifact'].outputs.version }}
          SOURCE_COMMIT: ${{ needs['build-immutable-artifact'].outputs.source_commit }}
        run: |
          local_integrity=$(node -e 'const { createHash }=require("node:crypto"); const { readFileSync }=require("node:fs"); console.log(`sha512-${createHash("sha512").update(readFileSync(process.argv[1])).digest("base64")}`)' "./release/$CLI_TARBALL_FILENAME")
          local_sha512=$(node -e 'const { createHash }=require("node:crypto"); const { readFileSync }=require("node:fs"); console.log(createHash("sha512").update(readFileSync(process.argv[1])).digest("hex"))' "./release/$CLI_TARBALL_FILENAME")
          npm_release_visible() {
            test "$(npm view "clawdi@$VERSION" version 2>/dev/null)" = "$VERSION"
          }
          # Re-evaluate the immutable registry boundary in this job. A failed-job
          # rerun can inherit an earlier publish decision after npm accepted the
          # package, and another release job may win the same race.
          if [ "$NPM_ACTION" = "publish" ] && npm_release_visible; then
            NPM_ACTION=verify
          fi
          case "$NPM_ACTION" in
            publish)
              npm publish "./release/$CLI_TARBALL_FILENAME" --access public --provenance --ignore-scripts --tag "$NPM_TAG"
              ;;
            verify) ;;
            *)
              echo "unsupported npm recovery action: $NPM_ACTION" >&2
              exit 64
              ;;
          esac
          # npm publication is immutable but registry reads are eventually
          # consistent. Wait only for the exact version just published or found;
          # all integrity and provenance checks below remain unchanged.
          registry_visible=false
          for attempt in $(seq 1 12); do
            if npm_release_visible; then
              registry_visible=true
              break
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          if [ "$registry_visible" != "true" ]; then
            echo "clawdi@$VERSION was not visible in the npm registry after 60 seconds" >&2
            exit 69
          fi
          published_integrity=$(npm view "clawdi@$VERSION" dist.integrity)
          attestations=$(npm view "clawdi@$VERSION" dist.attestations --json)
          attestation_url=$(ATTESTATIONS="$attestations" node - <<'NODE'
          const attestations = JSON.parse(process.env.ATTESTATIONS);
          const url = new URL(attestations.url);
          if (url.origin !== "https://registry.npmjs.org") process.exit(1);
          console.log(attestations.url);
          NODE
          )
          attestation_bundle=""
          for attempt in $(seq 1 12); do
            if attestation_bundle=$(curl --fail --silent --location "$attestation_url"); then
              break
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          if [ -z "$attestation_bundle" ]; then
            echo "clawdi@$VERSION provenance was not visible after 60 seconds" >&2
            exit 69
          fi
          tag="clawdi-cli-v$VERSION"
          release_json=null
          if existing_release=$(gh release view "$tag" --json isDraft,targetCommitish,assets 2>/dev/null); then
            release_json="$existing_release"
          fi
          tag_commit=null
          if resolved_tag=$(git rev-list -n 1 "$tag" 2>/dev/null); then
            tag_commit="\"$resolved_tag\""
          fi
          recovery_input=$(PUBLISHED_INTEGRITY="$published_integrity" ATTESTATIONS="$attestations" \
            ATTESTATION_BUNDLE="$attestation_bundle" LOCAL_INTEGRITY="$local_integrity" \
            LOCAL_SHA512="$local_sha512" RELEASE_JSON="$release_json" TAG_COMMIT="$tag_commit" \
            node - <<'NODE'
          console.log(JSON.stringify({
            schemaVersion: "clawdi.cliReleaseRecoveryInput.v1",
            mode: "complete",
            package: { name: "clawdi", version: process.env.VERSION },
            repository: {
              url: `https://github.com/${process.env.GITHUB_REPOSITORY}`,
              workflowPath: ".github/workflows/cli-publish.yml",
            },
            expectedSourceCommit: process.env.SOURCE_COMMIT,
            requiredAssets: [
              "clawdi-cli-linux-x64.tar.gz",
              "clawdi-cli-linux-arm64.tar.gz",
              "clawdi-cli-linux-x64-musl.tar.gz",
              "clawdi-cli-linux-arm64-musl.tar.gz",
              "clawdi-cli-darwin-x64.tar.gz",
              "clawdi-cli-darwin-arm64.tar.gz",
              "clawdi-cli-manifest.txt",
              "install.sh",
            ],
            localArtifact: {
              integrity: process.env.LOCAL_INTEGRITY,
              sha512: process.env.LOCAL_SHA512,
            },
            npm: {
              exists: true,
              distIntegrity: process.env.PUBLISHED_INTEGRITY,
              attestations: JSON.parse(process.env.ATTESTATIONS),
              attestationBundle: JSON.parse(process.env.ATTESTATION_BUNDLE),
            },
            github: {
              release: JSON.parse(process.env.RELEASE_JSON),
              tagCommit: JSON.parse(process.env.TAG_COMMIT),
            },
          }));
          NODE
          )
          recovery=$(node packages/cli/scripts/release-recovery.mjs <<< "$recovery_input")
          RECOVERY="$recovery" node - <<'NODE'
          const fs = require("node:fs");
          const decision = JSON.parse(process.env.RECOVERY);
          const outputs = {
            release_target: decision.releaseTarget,
            release_action: decision.releaseAction,
            finalize: decision.finalize,
          };
          fs.appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(outputs)
            .map(([key, value]) => `${key}=${value}\n`).join(""));
          NODE

      - name: Create GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs['build-immutable-artifact'].outputs.version }}
          NPM_TAG: ${{ needs['build-immutable-artifact'].outputs.npm_tag }}
          RELEASE_TARGET: ${{ steps.publish.outputs.release_target }}
          RELEASE_ACTION: ${{ steps.publish.outputs.release_action }}
          FINALIZE_RELEASE: ${{ steps.publish.outputs.finalize }}
        run: |
          tag="clawdi-cli-v$VERSION"
          previous=$(git tag --list 'clawdi-cli-v*' --sort=-version:refname | grep -Fxv "$tag" | head -n 1 || true)
          notes=$(cat <<EOF
          ## Package

          \`curl -fsSL https://raw.githubusercontent.com/Clawdi-AI/clawdi/main/install.sh | sh\`

          \`npm install -g clawdi@$VERSION\`

          Published with npm tag \`$NPM_TAG\` for exact version
          \`clawdi@$VERSION\` from the immutable artifact verified by this
          repository's release workflow.

          This is the release for the published \`packages/cli\` package.
          Clawdi app/backend/web changes are versioned separately as
          \`clawdi-YYYY-MM-DD[-N]\` releases.
          EOF
          )
          if [ "$RELEASE_ACTION" = "resume-draft" ]; then
            gh release upload "$tag" \
              release/clawdi-cli-*.tar.gz \
              release/clawdi-cli-manifest.txt \
              release/install.sh \
              --clobber
            if [ "$FINALIZE_RELEASE" = true ]; then
              gh release edit "$tag" --draft=false
            fi
            exit 0
          fi
          if [ "$RELEASE_ACTION" = "none" ]; then
            exit 0
          fi
          if [ "$RELEASE_ACTION" != "create-draft" ]; then
            echo "unsupported GitHub release recovery action: $RELEASE_ACTION" >&2
            exit 64
          fi
          args=(
            release create "$tag"
            release/clawdi-cli-*.tar.gz
            release/clawdi-cli-manifest.txt
            release/install.sh
            --target "$RELEASE_TARGET"
            --title "Clawdi CLI v$VERSION"
            --notes "$notes"
            --generate-notes
            --draft
            --latest=false
          )
          case "$NPM_TAG" in
            beta)
              args+=(--prerelease)
              ;;
            latest) ;;
            *)
              echo "unsupported npm release tag: $NPM_TAG" >&2
              exit 64
              ;;
          esac
          if [ -n "$previous" ]; then
            args+=(--notes-start-tag "$previous")
          fi
          gh "${args[@]}"
          if [ "$FINALIZE_RELEASE" = true ]; then
            gh release edit "$tag" --draft=false
          fi
