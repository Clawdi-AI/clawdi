name: Publish Agent v2 CLI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/cli/package.json"

concurrency:
  group: cli-publish
  cancel-in-progress: false

env:
  CLI_ARTIFACT_NAME: clawdi-cli-release
  CLI_FINAL_ARTIFACT_NAME: clawdi-cli-release-final

# This repository builds, verifies, and publishes one immutable artifact.
# Prereleases publish to beta; stable releases publish to latest.
jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Gate the expensive build and protected publisher with a standard job output.
      # https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/pass-job-outputs
      # https://docs.github.com/en/webhooks/webhook-events-and-payloads#push (before)
      # https://docs.npmjs.com/cli/v11/commands/npm-view
      - name: Check version bump and npm registry
        id: check
        working-directory: packages/cli
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          package_name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          test "$package_name" = "clawdi"
          if [ "$EVENT_NAME" = push ]; then
            previous_version=$(git show "$PREVIOUS_SHA:packages/cli/package.json" | node -p "JSON.parse(require('node:fs').readFileSync(0, 'utf8')).version")
            if [ "$version" = "$previous_version" ]; then
              echo "Skipping CLI publish: version $version did not change."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Read the existing package's full version list so registry errors fail
          # explicitly instead of being mistaken for an unpublished version.
          versions_json=$(npm view "$package_name" versions --json)
          VERSIONS_JSON="$versions_json" VERSION="$version" node - <<'NODE'
          const fs = require("node:fs");
          const versions = JSON.parse(process.env.VERSIONS_JSON);
          if (!Array.isArray(versions) || !versions.every((version) => typeof version === "string")) {
            throw new Error("npm returned an invalid package version list");
          }
          const published = versions.includes(process.env.VERSION);
          console.log(published
            ? `Skipping CLI publish: clawdi@${process.env.VERSION} is already on npm.`
            : `Publishing new CLI version: ${process.env.VERSION}.`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `publish=${!published}\n`);
          NODE

  build-immutable-artifact:
    needs: release-check
    if: needs.release-check.outputs.publish == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'blacksmith-16vcpu-ubuntu-2404' }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      npm_tag: ${{ steps.check.outputs.npm_tag }}
      cli_tarball_filename: ${{ steps.check.outputs.cli_tarball_filename }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve exact release identity
        id: check
        working-directory: packages/cli
        run: |
          package_name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          test "$package_name" = "clawdi"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "$version" in
            *-*) npm_tag=beta ;;
            *) npm_tag=latest ;;
          esac
          VERSION="$version" NPM_TAG="$npm_tag" node - <<'NODE'
          const fs = require("node:fs");
          const outputs = {
            version: process.env.VERSION,
            npm_tag: process.env.NPM_TAG,
            cli_tarball_filename: `clawdi-${process.env.VERSION}.tgz`,
          };
          fs.appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(outputs)
            .map(([key, value]) => `${key}=${value}\n`).join(""));
          NODE

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        working-directory: packages/cli
        run: bun run typecheck

      - name: Set up native Agent test dependencies
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.5"
          python-version: "3.12"

      # Client CI runs the full suite for this SHA; publishing verifies the built artifacts.
      - name: Build package and native release matrix
        id: build_native_release
        working-directory: packages/cli
        run: |
          bun run build
          bun run build:native-release
          ./dist-native/linux-x64/clawdi --version
          bun run check:native-release

      - name: Native lifecycle (ephemeral internal suite)
        working-directory: packages/cli
        run: |
          CLAWDI_NATIVE_BINARY=dist-native/linux-x64/clawdi \
            bun test \
              tests/e2e/native-installer.e2e.test.ts \
              tests/e2e/native-daemon.e2e.test.ts

      - name: Pack and verify immutable release artifact
        id: pack_release
        working-directory: packages/cli
        run: |
          sh -n ../../install.sh
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command '[ScriptBlock]::Create((Get-Content -Raw ../../install.ps1)) | Out-Null'
          fi
          node scripts/check-publish-manifest.mjs
          release_dir="$RUNNER_TEMP/clawdi-cli-release"
          install_dir="$RUNNER_TEMP/clawdi-cli-install"
          mkdir -p "$release_dir" "$install_dir"
          pack_json=$(npm pack --json --ignore-scripts --pack-destination "$release_dir")
          tarball=$(node scripts/check-publish-manifest.mjs --pack-json <<< "$pack_json")
          tarball_path="$release_dir/$tarball"
          tarball_sha=$(sha256sum "$tarball_path" | cut -d' ' -f1)
          printf '%s  %s\n' "$tarball_sha" "$tarball" > "$release_dir/$tarball.sha256"
          cp dist-release/clawdi-cli-*.tar.gz "$release_dir/"
          cp dist-release/clawdi-cli-manifest-v2.txt "$release_dir/"
          cp ../../install.sh "$release_dir/"
          cp ../../install.ps1 "$release_dir/"
          (cd "$release_dir" && sha256sum --check "$tarball.sha256")
          bun run scripts/check-native-release.mjs "$release_dir" "$(node -p "require('./package.json').version")"
          cd "$install_dir"
          npm init -y >/dev/null
          npm install "$tarball_path" --ignore-scripts --no-audit --no-fund
          "$install_dir/node_modules/.bin/clawdi" --version
          test -f "$install_dir/node_modules/clawdi/skills/clawdi/SKILL.md"
          test -f "$install_dir/node_modules/clawdi/skills/hosted-versions/1/clawdi/SKILL.md"
          test -f "$install_dir/node_modules/clawdi/egress-addon/clawdi_egress_addon.py"

      - name: Upload immutable CLI release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CLI_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/clawdi-cli-release/
          if-no-files-found: error
          retention-days: 1

  sign-macos-native:
    needs: build-immutable-artifact
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install manifest validation dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download unsigned CLI release artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CLI_ARTIFACT_NAME }}
          path: release

      - name: Sign and notarize macOS native CLI archives when credentials are available
        env:
          CLI_VERSION: ${{ needs['build-immutable-artifact'].outputs.version }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          # Feature branches and previews may not have release credentials. Keep
          # the unsigned artifact in that case so build and test workflows remain
          # useful; protected releases use the exact Desktop signing secrets.
          if [ -z "${CSC_LINK:-}" ] || [ -z "${CSC_KEY_PASSWORD:-}" ] || \
             [ -z "${APPLE_API_KEY_CONTENT:-}" ] || [ -z "${APPLE_API_KEY_ID:-}" ] || \
             [ -z "${APPLE_API_ISSUER:-}" ]; then
            echo "Apple CLI signing secrets are unavailable; retaining unsigned native archives."
            exit 0
          fi

          bash ./apps/desktop/scripts/with-signing-keychain.sh bash -s <<'SIGN'
          set -euo pipefail
          umask 077
          entitlements="$PWD/packages/cli/scripts/macos-cli-entitlements.plist"
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
          unset APPLE_API_KEY_CONTENT
          xcrun notarytool history --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" > /dev/null

          for target in darwin-x64 darwin-arm64; do
            asset="clawdi-cli-$target.tar.gz"
            archive="$PWD/release/$asset"
            stage="$RUNNER_TEMP/clawdi-cli-$target"
            zip="$RUNNER_TEMP/clawdi-cli-$target.zip"
            result="$RUNNER_TEMP/clawdi-cli-$target-notary.json"
            submit_stderr="$RUNNER_TEMP/clawdi-cli-$target-notary.stderr"
            log="$RUNNER_TEMP/clawdi-cli-$target-notary-log.json"
            rm -rf "$stage" "$zip" "$result" "$submit_stderr" "$log"
            mkdir -p "$stage"
            # Preserve payload modes despite the signing key's restrictive umask.
            tar -xpzf "$archive" -C "$stage"
            cli="$stage/clawdi"

            # Bun documents these hardened-runtime exceptions for compiled
            # executables because its runtime may JIT and allocate executable memory.
            codesign --force --options runtime --timestamp \
              --identifier ai.clawdi.cli --entitlements "$entitlements" \
              --sign "Developer ID Application" "$cli"
            codesign --verify --strict --verbose=2 "$cli"
            signature="$(codesign -dv --verbose=4 "$cli" 2>&1)"
            printf '%s\n' "$signature" | grep -q '^Authority=Developer ID Application:'
            printf '%s\n' "$signature" | grep -Eq '^TeamIdentifier=[A-Z0-9]{10}$'

            # Apple documents notarytool for release submissions:
            # https://developer.apple.com/documentation/security/notarizing_macos_software_before_distribution
            # TN2206 validates standalone command-line binaries with codesign
            # (its example uses /sbin/md5):
            # https://developer.apple.com/library/archive/technotes/tn2206/_index.html
            # Bare executables cannot be stapled. Submit a zip to Apple's
            # notary service, then retain the signed executable in its tarball.
            ditto -c -k --keepParent "$cli" "$zip"
            set +e
            xcrun notarytool submit "$zip" --wait --timeout 30m --output-format json \
              --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" > "$result" 2> "$submit_stderr"
            submit_exit=$?
            set -e
            submission_id="$(node -e 'const fs=require("node:fs"); const value=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(typeof value.id === "string" ? value.id : "")' "$result" 2>/dev/null || true)"
            submission_status="$(node -e 'const fs=require("node:fs"); const value=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(typeof value.status === "string" ? value.status : "")' "$result" 2>/dev/null || true)"
            if [ "$submit_exit" -ne 0 ] || [ "$submission_status" != "Accepted" ] || [ -z "$submission_id" ]; then
              echo "Apple notarization did not succeed for $asset (status=${submission_status:-unknown}, exit=$submit_exit)." >&2
              if [ -n "$submission_id" ]; then
                if ! xcrun notarytool log "$submission_id" --output-format json \
                  --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" \
                  --issuer "$APPLE_API_ISSUER" > "$log"; then
                  echo "Unable to retrieve the Apple notarization log." >&2
                fi
                cat "$log" >&2 || true
              else
                cat "$result" >&2 || true
                cat "$submit_stderr" >&2 || true
              fi
              exit 1
            fi
            xcrun notarytool log "$submission_id" --output-format json \
              --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" > "$log"
            # Gatekeeper's spctl assessment is app-oriented and may reject a
            # correctly signed bare CLI as “does not seem to be an app”. Keep
            # it as an informational diagnostic; codesign and notarytool are
            # the release gates for this standalone executable.
            if ! spctl --assess --type execute --verbose=4 "$cli"; then
              echo "spctl informational assessment rejected the bare CLI; codesign and notarytool gates passed." >&2
            fi

            CLAWDI_NATIVE_TARGET="$target" bun run packages/cli/scripts/package-native-release.mjs \
              "$stage" "$PWD/release"
            rm -rf "$stage" "$zip"
          done

          # Recompute archive hashes only after signing. These are the hashes
          # consumed by installers, attestations, and release verification.
          bun run packages/cli/scripts/refresh-native-release-manifest.mjs release "$CLI_VERSION"
          bun run packages/cli/scripts/check-native-release.mjs release "$CLI_VERSION"
          SIGN

      - name: Upload final CLI release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CLI_FINAL_ARTIFACT_NAME }}
          path: release/
          if-no-files-found: error
          retention-days: 1

  publish-immutable-artifact-with-oidc:
    needs: [build-immutable-artifact, sign-macos-native]
    # npm trusted publishing supports GitHub-hosted runners, not self-hosted runners.
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Verify current workflow source
        env:
          VERSION: ${{ needs['build-immutable-artifact'].outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node -p "require('./packages/cli/package.json').version")" = "$VERSION"

      - name: Install immutable verification dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify trusted publishing toolchain
        run: |
          npm install --global npm@12.0.2
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major !== 24 || minor < 15) process.exit(1)'
          test "$(npm --version)" = "12.0.2"

      - name: Download immutable CLI release artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CLI_FINAL_ARTIFACT_NAME }}
          path: release

      - name: Verify release artifact
        id: verify_release
        env:
          VERSION: ${{ needs['build-immutable-artifact'].outputs.version }}
          CLI_TARBALL_FILENAME: ${{ needs['build-immutable-artifact'].outputs.cli_tarball_filename }}
        run: |
          cd release
          tarball="$CLI_TARBALL_FILENAME"
          test -s "$tarball"
          test -s "$tarball.sha256"
          test -s clawdi-cli-manifest-v2.txt
          test -s install.sh
          test -s install.ps1
          for target in linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl darwin-x64 darwin-arm64 win32-x64 win32-arm64; do
            test -s "clawdi-cli-$target.tar.gz"
          done
          sha256sum --check "$tarball.sha256"
          bun run ../packages/cli/scripts/check-native-release.mjs . "$VERSION"
          manifest=$(tar -xOf "$tarball" package/package.json)
          test "$(node -e "const fs=require('node:fs'); console.log(JSON.parse(fs.readFileSync(0,'utf8')).name)" <<< "$manifest")" = "clawdi"
          test "$(node -e "const fs=require('node:fs'); console.log(JSON.parse(fs.readFileSync(0,'utf8')).version)" <<< "$manifest")" = "$VERSION"

      - name: Attest native release archives
        uses: actions/attest@v4
        with:
          subject-path: |
            release/clawdi-cli-*.tar.gz
            release/clawdi-cli-manifest-v2.txt

      - name: Create or complete GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs['build-immutable-artifact'].outputs.version }}
          NPM_TAG: ${{ needs['build-immutable-artifact'].outputs.npm_tag }}
        run: |
          tag="clawdi-cli-v$VERSION"
          if tag_commit=$(git rev-list -n 1 "$tag" 2>/dev/null); then
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "$tag points to $tag_commit instead of this workflow commit $GITHUB_SHA" >&2
              exit 65
            fi
          fi
          release_action=create-draft
          if existing_release=$(gh release view "$tag" --json assets,isDraft,targetCommitish 2>/dev/null); then
            release_action=$(RELEASE_JSON="$existing_release" EXPECTED_COMMIT="$GITHUB_SHA" node - <<'NODE'
          const release = JSON.parse(process.env.RELEASE_JSON);
          if (release.targetCommitish !== process.env.EXPECTED_COMMIT) {
            console.error(`GitHub release targets ${release.targetCommitish} instead of this workflow commit ${process.env.EXPECTED_COMMIT}`);
            process.exit(65);
          }
          console.log(release.isDraft ? "resume-draft" : "none");
          NODE
            )
          fi
          previous=$(git tag --list 'clawdi-cli-v*' --sort=-version:refname | grep -Fxv "$tag" | head -n 1 || true)
          notes=$(cat <<EOF
          ## Package

          \`curl -fsSL https://raw.githubusercontent.com/Clawdi-AI/clawdi/main/install.sh | sh\`

          \`npm install -g clawdi@$VERSION\`

          Published with npm tag \`$NPM_TAG\` for exact version
          \`clawdi@$VERSION\` from the immutable artifact verified by this
          repository's release workflow.

          This is the release for the published \`packages/cli\` package.
          Clawdi app/backend/web changes are versioned separately as
          \`clawdi-YYYY-MM-DD[-N]\` releases.
          EOF
          )
          if [ "$release_action" = "resume-draft" ]; then
            assets=(
              release/clawdi-cli-*.tar.gz
              release/clawdi-cli-manifest-v2.txt
              release/install.sh
              release/install.ps1
            )
            missing_assets=$(RELEASE_JSON="$existing_release" node - "${assets[@]}" <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync, statSync } = require("node:fs");
          const { basename } = require("node:path");
          const remoteAssets = JSON.parse(process.env.RELEASE_JSON).assets;
          for (const localPath of process.argv.slice(2)) {
            const name = basename(localPath);
            const matches = remoteAssets.filter((asset) => asset.name === name);
            if (matches.length > 1) {
              console.error(`GitHub release has duplicate assets named ${name}`);
              process.exit(65);
            }
            if (matches.length === 0) {
              console.log(localPath);
              continue;
            }
            const digest = `sha256:${createHash("sha256").update(readFileSync(localPath)).digest("hex")}`;
            const size = statSync(localPath).size;
            if (matches[0].digest !== digest || matches[0].size !== size) {
              console.error(`GitHub release asset ${name} does not match this workflow artifact`);
              process.exit(65);
            }
          }
          NODE
            )
            if [ -n "$missing_assets" ]; then
              mapfile -t assets_to_upload <<< "$missing_assets"
              gh release upload "$tag" "${assets_to_upload[@]}"
            fi
            gh release edit "$tag" --draft=false
            exit 0
          fi
          if [ "$release_action" = "none" ]; then
            exit 0
          fi
          if [ "$release_action" != "create-draft" ]; then
            echo "unsupported GitHub release action: $release_action" >&2
            exit 64
          fi
          args=(
            release create "$tag"
            release/clawdi-cli-*.tar.gz
            release/clawdi-cli-manifest-v2.txt
            release/install.sh
            release/install.ps1
            --target "$GITHUB_SHA"
            --title "Clawdi CLI v$VERSION"
            --notes "$notes"
            --generate-notes
            --draft
            --latest=false
          )
          case "$NPM_TAG" in
            beta)
              args+=(--prerelease)
              ;;
            latest) ;;
            *)
              echo "unsupported npm release tag: $NPM_TAG" >&2
              exit 64
              ;;
          esac
          if [ -n "$previous" ]; then
            args+=(--notes-start-tag "$previous")
          fi
          gh "${args[@]}"
          gh release edit "$tag" --draft=false
      - name: Publish or verify immutable tarball
        id: publish
        env:
          CLI_TARBALL_FILENAME: ${{ needs['build-immutable-artifact'].outputs.cli_tarball_filename }}
          NPM_TAG: ${{ needs['build-immutable-artifact'].outputs.npm_tag }}
          VERSION: ${{ needs['build-immutable-artifact'].outputs.version }}
        run: |
          # JavaScript template literals below intentionally use shell single quotes.
          # https://www.shellcheck.net/wiki/SC2016
          # shellcheck disable=SC2016
          local_integrity=$(node -e 'const { createHash }=require("node:crypto"); const { readFileSync }=require("node:fs"); console.log(`sha512-${createHash("sha512").update(readFileSync(process.argv[1])).digest("base64")}`)' "./release/$CLI_TARBALL_FILENAME")
          npm_release_visible() {
            test "$(npm view "clawdi@$VERSION" version 2>/dev/null)" = "$VERSION"
          }
          if ! npm_release_visible; then
            npm publish "./release/$CLI_TARBALL_FILENAME" --access public --provenance --ignore-scripts --tag "$NPM_TAG"
            registry_visible=false
            for attempt in $(seq 1 60); do
              if npm_release_visible; then
                registry_visible=true
                break
              fi
              if [ "$attempt" -lt 60 ]; then sleep 10; fi
            done
            if [ "$registry_visible" != "true" ]; then
              echo "clawdi@$VERSION was not visible in the npm registry after 10 minutes" >&2
              exit 69
            fi
          fi
          registry_version=$(npm view "clawdi@$VERSION" version)
          test "$registry_version" = "$VERSION"
          published_integrity=$(npm view "clawdi@$VERSION" dist.integrity)
          if [ "$published_integrity" != "$local_integrity" ]; then
            echo "clawdi@$VERSION registry integrity does not match this workflow artifact" >&2
            exit 65
          fi
