name: Desktop Update E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-channel-build.yml'
      - '.github/workflows/desktop-update-site.yml'
      - '.github/workflows/desktop-update-e2e.yml'
      - 'apps/web/public/clawdi-logo-transparent.png'
      - 'packages/shared/src/desktop.ts'
      - 'packages/shared/package.json'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.base.json'

permissions:
  contents: read

concurrency:
  group: desktop-update-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  appimage-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: AppImage N to N+1 over trusted local HTTPS
        run: bash apps/desktop/scripts/update-e2e.sh
