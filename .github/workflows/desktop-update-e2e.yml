name: Desktop Update E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-channel-build.yml'
      - '.github/workflows/desktop-update-site.yml'
      - '.github/workflows/desktop-update-e2e.yml'
      - 'apps/web/public/clawdi-logo-transparent.png'
      - 'packages/shared/src/desktop.ts'
      - 'packages/shared/package.json'
      - 'packages/cli/src/serve/windows-task.ts'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.base.json'

permissions:
  contents: read

concurrency:
  group: desktop-update-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  appimage-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Shared device login and embedded dashboard in real Electron
        run: bash apps/desktop/scripts/shared-login-e2e.sh
      - name: AppImage N to N+1 over trusted local HTTPS
        run: bash apps/desktop/scripts/update-e2e.sh

  nsis-update:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      BIOME_THREADS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: NSIS N to N+1 over trusted local HTTPS and service recovery
        run: bun apps/desktop/scripts/update-e2e-windows.ts
