name: Clawdi Image Release

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build. Defaults to the workflow SHA."
        required: false
      build_web:
        description: "Also publish the web image. Requires matching public web build variables."
        required: false
        type: boolean
        default: false
      web_public_api_url:
        description: "VITE_CLAWDI_API_URL baked into the web image."
        required: false
        default: "http://localhost:8000"
      web_clerk_publishable_key:
        description: "VITE_CLERK_PUBLISHABLE_KEY baked into the web image."
        required: false
      web_public_deploy_api_url:
        description: "VITE_CLAWDI_DEPLOY_API_URL baked into the web image."
        required: false
        default: "http://localhost:50021"

permissions:
  contents: read
  packages: write

concurrency:
  group: clawdi-image-release-production
  cancel-in-progress: false

env:
  BACKEND_IMAGE_NAME: ghcr.io/clawdi-ai/clawdi-backend
  WEB_IMAGE_NAME: ghcr.io/clawdi-ai/clawdi-web

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ${{ vars.CI_RUNNER || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.rev.outputs.sha }}
      build_required: ${{ steps.runtime-changes.outputs.build }}
    steps:
      - name: Resolve source ref
        id: source-ref
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            ref="${{ github.event.workflow_run.head_sha }}"
          else
            ref="${{ inputs.ref }}"
            if [ -z "$ref" ]; then
              ref="${GITHUB_SHA}"
            fi
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.source-ref.outputs.ref }}
          fetch-depth: 2

      - id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Detect backend image changes
        id: runtime-changes
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "reason=workflow_dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff-tree --no-commit-id --name-only -r -m --first-parent "${{ steps.rev.outputs.sha }}")"
          printf '%s\n' "$changed_files"

          build=false
          readarray -t files <<< "$changed_files"
          for file in "${files[@]}"; do
            case "$file" in
              backend/*|.dockerignore|.github/workflows/clawdi-image-release.yml)
                build=true
                ;;
            esac
          done

          echo "build=${build}" >> "$GITHUB_OUTPUT"
          if [ "$build" = "true" ]; then
            echo "reason=backend_image_inputs_changed" >> "$GITHUB_OUTPUT"
          else
            echo "reason=no_backend_image_inputs_changed" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.runtime-changes.outputs.build == 'true'

      - uses: docker/login-action@v4
        if: steps.runtime-changes.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve OCI label metadata
        if: steps.runtime-changes.outputs.build == 'true'
        id: labels
        run: |
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "created=${created}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        if: steps.runtime-changes.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.BACKEND_IMAGE_NAME }}:${{ steps.rev.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
            org.opencontainers.image.version=${{ steps.rev.outputs.sha }}
            org.opencontainers.image.created=${{ steps.labels.outputs.created }}
            org.opencontainers.image.title=Clawdi Backend
            org.opencontainers.image.description=Open-source Clawdi FastAPI backend image for self-hosted and Coolify deployments.
          provenance: false
          cache-from: type=gha,scope=clawdi-backend-image
          cache-to: type=gha,mode=max,scope=clawdi-backend-image

      - name: Validate web image inputs
        if: steps.runtime-changes.outputs.build == 'true' && inputs.build_web
        env:
          WEB_CLERK_PUBLISHABLE_KEY: ${{ inputs.web_clerk_publishable_key }}
        run: |
          if [ -z "$WEB_CLERK_PUBLISHABLE_KEY" ]; then
            echo "web_clerk_publishable_key is required when build_web=true." >&2
            exit 1
          fi

      - name: Build and push web image
        if: steps.runtime-changes.outputs.build == 'true' && inputs.build_web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.WEB_IMAGE_NAME }}:${{ steps.rev.outputs.sha }}
          build-args: |
            VITE_CLAWDI_API_URL=${{ inputs.web_public_api_url }}
            VITE_CLERK_PUBLISHABLE_KEY=${{ inputs.web_clerk_publishable_key }}
            VITE_CLAWDI_HOSTED=
            VITE_CLAWDI_DEPLOY_API_URL=${{ inputs.web_public_deploy_api_url }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
            org.opencontainers.image.version=${{ steps.rev.outputs.sha }}
            org.opencontainers.image.created=${{ steps.labels.outputs.created }}
            org.opencontainers.image.title=Clawdi Web
            org.opencontainers.image.description=Open-source Clawdi dashboard image for self-hosted deployments.
          provenance: false
          cache-from: type=gha,scope=clawdi-web-image
          cache-to: type=gha,mode=max,scope=clawdi-web-image

      - name: Print image summary
        if: steps.runtime-changes.outputs.build == 'true'
        run: |
          echo "### Clawdi Images" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend: \`${{ env.BACKEND_IMAGE_NAME }}:${{ steps.rev.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.build_web }}" = "true" ]; then
            echo "- Web: \`${{ env.WEB_IMAGE_NAME }}:${{ steps.rev.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Web: skipped" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Print skipped image summary
        if: steps.runtime-changes.outputs.build != 'true'
        run: |
          echo "### Clawdi Images" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend image build: skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reason: \`${{ steps.runtime-changes.outputs.reason }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: \`${{ steps.rev.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
  deploy-vps:
    needs: build
    if: needs.build.outputs.build_required == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    concurrency:
      group: kamal-deploy-clawdi
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.image_tag }}

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Pin server host keys
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Write Kamal secrets
        env:
          KAMAL_SECRETS: ${{ secrets.KAMAL_SECRETS }}
        run: |
          mkdir -p .kamal
          printf '%s\n' "$KAMAL_SECRETS" > .kamal/secrets
          chmod 600 .kamal/secrets

      - name: Prepare runner for Ruby
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/hostedtoolcache
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libyaml-0-2 build-essential

      - name: Install Kamal
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Kamal deploy
        env:
          CLOUDFLARE_ORIGIN_CERT: ${{ secrets.CLOUDFLARE_ORIGIN_CERT }}
          CLOUDFLARE_ORIGIN_KEY: ${{ secrets.CLOUDFLARE_ORIGIN_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PROXY_COMMAND: ${{ secrets.DEPLOY_SSH_PROXY_COMMAND }}
        run: |
          gem install kamal -v '~> 2.12' --no-document
          kamal deploy -P --version "${{ needs.build.outputs.image_tag }}"
