name: Clawdi Image Release

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build. Defaults to the workflow SHA. Do not use an older ref while an automatic release is running or pending."
        required: false
      build_web:
        description: "Also publish the web image. Requires matching public web build variables."
        required: false
        type: boolean
        default: false
      web_public_api_url:
        description: "VITE_CLAWDI_API_URL baked into the web image."
        required: false
        default: "http://localhost:8000"
      web_clerk_publishable_key:
        description: "VITE_CLERK_PUBLISHABLE_KEY baked into the web image."
        required: false
      web_public_deploy_api_url:
        description: "VITE_CLAWDI_DEPLOY_API_URL baked into the web image."
        required: false
        default: "http://localhost:50021"

permissions:
  contents: read
  packages: write

concurrency:
  group: clawdi-image-release-production
  cancel-in-progress: false
  queue: max

env:
  BACKEND_IMAGE_NAME: ghcr.io/clawdi-ai/clawdi-backend
  SIDECAR_IMAGE_NAME: ghcr.io/clawdi-ai/clawdi-whatsapp-baileys-sidecar
  WEB_IMAGE_NAME: ghcr.io/clawdi-ai/clawdi-web

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ${{ vars.CI_RUNNER || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.rev.outputs.sha }}
      sidecar_revision: ${{ steps.sidecar-revision.outputs.revision }}
    steps:
      - name: Resolve source ref
        id: source-ref
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            ref="${{ github.event.workflow_run.head_sha }}"
          else
            ref="${{ inputs.ref }}"
            if [ -z "$ref" ]; then
              ref="${GITHUB_SHA}"
            fi
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source-ref.outputs.ref }}
          fetch-depth: 2

      - id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve WhatsApp sidecar deployment revision
        id: sidecar-revision
        run: |
          revision="$(
            git ls-tree -r --full-tree HEAD -- \
              .dockerignore \
              package.json \
              bun.lock \
              tsconfig.base.json \
              apps/web/package.json \
              packages/cli/package.json \
              packages/shared/package.json \
              packages/whatsapp-baileys-sidecar \
              config/deploy.yml |
              awk '$4 !~ /\.test\.ts$/' |
              sha256sum |
              cut -d ' ' -f 1
          )"
          test "${#revision}" = 64
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve OCI label metadata
        id: labels
        run: |
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "created=${created}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.BACKEND_IMAGE_NAME }}:${{ steps.rev.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
            org.opencontainers.image.version=${{ steps.rev.outputs.sha }}
            org.opencontainers.image.created=${{ steps.labels.outputs.created }}
            org.opencontainers.image.title=Clawdi Backend
            org.opencontainers.image.description=Open-source Clawdi FastAPI backend image for self-hosted and Coolify deployments.
          provenance: false
          cache-from: type=gha,scope=clawdi-backend-image
          cache-to: type=gha,mode=max,scope=clawdi-backend-image

      - name: Build and push WhatsApp sidecar image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/whatsapp-baileys-sidecar/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.SIDECAR_IMAGE_NAME }}:${{ steps.rev.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
            org.opencontainers.image.version=${{ steps.rev.outputs.sha }}
            org.opencontainers.image.created=${{ steps.labels.outputs.created }}
            org.opencontainers.image.title=Clawdi WhatsApp Baileys Sidecar
            org.opencontainers.image.description=Multiplexed physical WhatsApp transport for Clawdi.
            io.clawdi.whatsapp-sidecar.deployment-revision=${{ steps.sidecar-revision.outputs.revision }}
          provenance: false
          cache-from: type=gha,scope=clawdi-whatsapp-sidecar-image
          cache-to: type=gha,mode=max,scope=clawdi-whatsapp-sidecar-image

      - name: Validate web image inputs
        if: inputs.build_web
        env:
          WEB_CLERK_PUBLISHABLE_KEY: ${{ inputs.web_clerk_publishable_key }}
        run: |
          if [ -z "$WEB_CLERK_PUBLISHABLE_KEY" ]; then
            echo "web_clerk_publishable_key is required when build_web=true." >&2
            exit 1
          fi

      - name: Build and push web image
        if: inputs.build_web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.WEB_IMAGE_NAME }}:${{ steps.rev.outputs.sha }}
          build-args: |
            VITE_CLAWDI_API_URL=${{ inputs.web_public_api_url }}
            VITE_CLERK_PUBLISHABLE_KEY=${{ inputs.web_clerk_publishable_key }}
            VITE_CLAWDI_HOSTED=
            VITE_CLAWDI_DEPLOY_API_URL=${{ inputs.web_public_deploy_api_url }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
            org.opencontainers.image.version=${{ steps.rev.outputs.sha }}
            org.opencontainers.image.created=${{ steps.labels.outputs.created }}
            org.opencontainers.image.title=Clawdi Web
            org.opencontainers.image.description=Open-source Clawdi dashboard image for self-hosted deployments.
          provenance: false
          cache-from: type=gha,scope=clawdi-web-image
          cache-to: type=gha,mode=max,scope=clawdi-web-image

      - name: Print image summary
        run: |
          echo "### Clawdi Images" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend: \`${{ env.BACKEND_IMAGE_NAME }}:${{ steps.rev.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- WhatsApp sidecar: \`${{ env.SIDECAR_IMAGE_NAME }}:${{ steps.rev.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- WhatsApp sidecar deployment revision: \`${{ steps.sidecar-revision.outputs.revision }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.build_web }}" = "true" ]; then
            echo "- Web: \`${{ env.WEB_IMAGE_NAME }}:${{ steps.rev.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Web: skipped" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-vps:
    needs: build
    runs-on: ${{ vars.CI_RUNNER || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.image_tag }}

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Pin server host keys
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Write Kamal secrets
        env:
          KAMAL_SECRETS: ${{ secrets.KAMAL_SECRETS }}
          CHANNEL_WHATSAPP_BAILEYS_SIDECAR_TOKEN: ${{ secrets.CHANNEL_WHATSAPP_BAILEYS_SIDECAR_TOKEN }}
          TS_AUTHKEY: ${{ secrets.WHATSAPP_TAILSCALE_AUTHKEY }}
          WHATSAPP_TAILSCALE_EGRESS_ENABLED: ${{ vars.WHATSAPP_TAILSCALE_EGRESS_ENABLED }}
        run: |
          test -n "$CHANNEL_WHATSAPP_BAILEYS_SIDECAR_TOKEN"
          case "$CHANNEL_WHATSAPP_BAILEYS_SIDECAR_TOKEN" in
            *[!A-Za-z0-9_-]*) exit 1 ;;
          esac
          test "${#CHANNEL_WHATSAPP_BAILEYS_SIDECAR_TOKEN}" -ge 43
          test "${#CHANNEL_WHATSAPP_BAILEYS_SIDECAR_TOKEN}" -le 128
          install -d -m 700 .kamal
          printf '%s\n' "$KAMAL_SECRETS" > .kamal/secrets
          secrets_tmp="$(mktemp)"
          trap 'rm -f "$secrets_tmp"' EXIT
          awk '
            !/^CLOUDFLARE_ORIGIN_CERT=/ && !/^CLOUDFLARE_ORIGIN_KEY=/ { print }
            END {
              print "CLOUDFLARE_ORIGIN_CERT=$CLOUDFLARE_ORIGIN_CERT"
              print "CLOUDFLARE_ORIGIN_KEY=$CLOUDFLARE_ORIGIN_KEY"
            }
          ' .kamal/secrets > "$secrets_tmp"
          mv "$secrets_tmp" .kamal/secrets
          printf 'CHANNEL_WHATSAPP_BAILEYS_SIDECAR_TOKEN=%s\n' \
            "$CHANNEL_WHATSAPP_BAILEYS_SIDECAR_TOKEN" >> .kamal/secrets
          if [ "$WHATSAPP_TAILSCALE_EGRESS_ENABLED" = true ]; then
            test -n "$TS_AUTHKEY"
            case "$TS_AUTHKEY" in
              tskey-*) ;;
              *) exit 1 ;;
            esac
            printf 'TS_AUTHKEY=%s\n' "$TS_AUTHKEY" >> .kamal/secrets
          fi
          chmod 600 .kamal/secrets

      - uses: ./.github/actions/setup-bun-ci
        with:
          bun-version: "1.3.14"

      - name: Prepare runner for Ruby
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/hostedtoolcache
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libyaml-0-2 build-essential

      - name: Install Kamal
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Kamal deploy
        env:
          CLOUDFLARE_ORIGIN_CERT: ${{ secrets.CLOUDFLARE_ORIGIN_CERT }}
          CLOUDFLARE_ORIGIN_KEY: ${{ secrets.CLOUDFLARE_ORIGIN_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PROXY_COMMAND: ${{ secrets.DEPLOY_SSH_PROXY_COMMAND }}
          DEPLOY_IMAGE_VERSION: ${{ needs.build.outputs.image_tag }}
          SIDECAR_REVISION: ${{ needs.build.outputs.sidecar_revision }}
          WHATSAPP_TAILSCALE_EGRESS_ENABLED: ${{ vars.WHATSAPP_TAILSCALE_EGRESS_ENABLED }}
          WHATSAPP_TAILSCALE_EXIT_NODE: ${{ vars.WHATSAPP_TAILSCALE_EXIT_NODE }}
          WHATSAPP_TAILSCALE_EXPECTED_PUBLIC_IP: ${{ vars.WHATSAPP_TAILSCALE_EXPECTED_PUBLIC_IP }}
        run: |
          gem install kamal -v '2.12.0' --no-document
          test "$(kamal version)" = "2.12.0"
          egress_enabled=false
          if [ "$WHATSAPP_TAILSCALE_EGRESS_ENABLED" = true ]; then
            egress_enabled=true
            test -n "$WHATSAPP_TAILSCALE_EXIT_NODE"
            test -n "$WHATSAPP_TAILSCALE_EXPECTED_PUBLIC_IP"
            case "$WHATSAPP_TAILSCALE_EXIT_NODE" in
              *[!A-Za-z0-9._:-]*) exit 1 ;;
            esac
            if ! printf '%s\n' "$WHATSAPP_TAILSCALE_EXPECTED_PUBLIC_IP" | \
              grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$'; then
              echo "WHATSAPP_TAILSCALE_EXPECTED_PUBLIC_IP must be an IPv4 address" >&2
              exit 1
            fi
            WHATSAPP_TAILSCALE_CONFIG_REVISION="$(
              printf '%s\n' \
                'tailscale/tailscale:v1.98.10@sha256:cdf5612ded5be1344f1a704b8c5e53496db97376bb533e5e15f141e48bf60cc0' \
                "$WHATSAPP_TAILSCALE_EXIT_NODE" \
                "$WHATSAPP_TAILSCALE_EXPECTED_PUBLIC_IP" |
                sha256sum |
                cut -d ' ' -f 1
            )"
            export WHATSAPP_TAILSCALE_CONFIG_REVISION
          elif [ -n "$WHATSAPP_TAILSCALE_EGRESS_ENABLED" ] && \
            [ "$WHATSAPP_TAILSCALE_EGRESS_ENABLED" != false ]; then
            echo "WHATSAPP_TAILSCALE_EGRESS_ENABLED must be exactly true or false/unset" >&2
            exit 1
          fi
          kamal accessory directories whatsapp-baileys
          kamal server exec \
            "test -d '/home/phala/clawdi-whatsapp/state' && \
             test ! -L '/home/phala/clawdi-whatsapp/state' && \
             test \"\$(realpath -e '/home/phala/clawdi-whatsapp/state')\" = \
               '/home/phala/clawdi-whatsapp/state' && \
             test \"\$(stat -c '%u:%g:%a' '/home/phala/clawdi-whatsapp/state')\" = '1000:1000:700' && \
             test -d '/home/phala/clawdi-whatsapp/run' && \
             test ! -L '/home/phala/clawdi-whatsapp/run' && \
             test \"\$(realpath -e '/home/phala/clawdi-whatsapp/run')\" = \
               '/home/phala/clawdi-whatsapp/run' && \
             test \"\$(stat -c '%u:%g:%a' '/home/phala/clawdi-whatsapp/run')\" = '1000:1000:770'"
          current_sidecar_inspect="$(
            kamal server exec \
              "docker container inspect --format '{{ index .Config.Labels \"io.clawdi.whatsapp-sidecar.deployment-revision\" }}' 'clawdi-whatsapp-baileys'"
          )"
          current_sidecar_revision="$(
            printf '%s\n' "$current_sidecar_inspect" |
              grep -Eo '[0-9a-f]{64}' |
              tail -n 1 || true
          )"
          sidecar_changed=false
          if [ "$current_sidecar_revision" != "$SIDECAR_REVISION" ]; then
            sidecar_changed=true
          fi
          pair_changed="$sidecar_changed"
          egress_changed=false
          if [ "$egress_enabled" = true ]; then
            current_egress_inspect="$(
              kamal server exec \
                "docker container inspect --format '{{ index .Config.Labels \"io.clawdi.whatsapp-egress.config-revision\" }}' 'clawdi-whatsapp-tailscale'" || true
            )"
            current_egress_revision="$(
              printf '%s\n' "$current_egress_inspect" |
                grep -Eo '[0-9a-f]{64}' |
                tail -n 1 || true
            )"
            if [ "$current_egress_revision" != "$WHATSAPP_TAILSCALE_CONFIG_REVISION" ]; then
              egress_changed=true
              pair_changed=true
            fi
            egress_sandbox_id="$(
              kamal server exec \
                "docker container inspect --format '{{.NetworkSettings.SandboxID}}' 'clawdi-whatsapp-tailscale'" 2>/dev/null |
                grep -Eo '[0-9a-f]{64}' |
                tail -n 1 || true
            )"
            sidecar_sandbox_id="$(
              kamal server exec \
                "docker container inspect --format '{{.NetworkSettings.SandboxID}}' 'clawdi-whatsapp-baileys'" 2>/dev/null |
                grep -Eo '[0-9a-f]{64}' |
                tail -n 1 || true
            )"
            if [ -z "$egress_sandbox_id" ] || \
              [ "$sidecar_sandbox_id" != "$egress_sandbox_id" ]; then
              pair_changed=true
            fi
          fi
          if [ "$pair_changed" = true ]; then
            if [ "$egress_changed" = true ]; then
              kamal accessory directories whatsapp-tailscale
              kamal accessory reboot whatsapp-tailscale
            fi
            if [ "$egress_enabled" = true ]; then
              egress_ready=false
              for _attempt in $(seq 1 30); do
                if kamal accessory exec whatsapp-tailscale --reuse \
                  "tailscale ping --timeout=10s '${WHATSAPP_TAILSCALE_EXIT_NODE}'" \
                  >/dev/null 2>&1; then
                  observed_ip="$(
                    kamal accessory exec whatsapp-tailscale --reuse \
                      "wget -qO- --timeout=10 https://api.ipify.org" 2>/dev/null |
                      grep -Eo '([0-9]{1,3}\.){3}[0-9]{1,3}' |
                      tail -n 1 || true
                  )"
                  if [ "$observed_ip" = "$WHATSAPP_TAILSCALE_EXPECTED_PUBLIC_IP" ]; then
                    egress_ready=true
                    break
                  fi
                fi
                sleep 2
              done
              if [ "$egress_ready" != true ]; then
                echo "WhatsApp Tailscale egress failed exit-node/public-IP preflight" >&2
                exit 1
              fi
            fi
            kamal accessory reboot whatsapp-baileys
            kamal server exec \
              "test \"\$(docker container inspect --format '{{.Config.Image}}' 'clawdi-whatsapp-baileys')\" = \
               'ghcr.io/clawdi-ai/clawdi-whatsapp-baileys-sidecar:${{ needs.build.outputs.image_tag }}'"
          else
            echo "WhatsApp egress/sidecar pair is unchanged; preserving the running processes."
          fi
          ready=false
          for _attempt in $(seq 1 30); do
            if kamal accessory exec whatsapp-baileys --reuse \
              "node /app/packages/whatsapp-baileys-sidecar/dist/healthcheck.js" \
              >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "WhatsApp sidecar failed readiness" >&2
            exit 1
          fi
          if [ "$pair_changed" = true ]; then
            postgres_output="$(
              kamal accessory exec postgres --reuse \
                "psql -U clawdi -d clawdi -Atqc \"SELECT id::text FROM channel_accounts WHERE provider = 'whatsapp' AND visibility = 'public' AND user_id IS NULL AND status = 'active' AND archived_at IS NULL AND config->>'connection_mode' = 'baileys_managed' AND config->>'phone_number' ~ '^[1-9][0-9]{6,14}$' ORDER BY id\""
            )"
            managed_session_ids="$(
              printf '%s\n' "$postgres_output" |
                grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}' |
                sort -u || true
            )"
            for session_id in $managed_session_ids; do
              recovered=false
              for _attempt in $(seq 1 30); do
                if kamal accessory exec whatsapp-baileys --reuse \
                  "node /app/packages/whatsapp-baileys-sidecar/dist/healthcheck.js ${session_id}" \
                  >/dev/null 2>&1; then
                  recovered=true
                  break
                fi
                sleep 2
              done
              if [ "$recovered" != true ]; then
                echo "Managed WhatsApp session failed post-restart recovery: ${session_id}" >&2
                exit 1
              fi
            done
          fi
          kamal deploy -P --version "${{ needs.build.outputs.image_tag }}"
