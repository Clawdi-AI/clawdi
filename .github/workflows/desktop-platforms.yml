name: Desktop Platform Packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/cli/**'
      - 'packages/shared/**'
      - 'apps/web/**'
      - 'bun.lock'
      - '.github/workflows/desktop-platforms.yml'

permissions:
  contents: read

concurrency:
  group: desktop-platforms-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-ci
      - name: Verify Desktop
        run: |
          bun run --cwd apps/desktop typecheck
          bun run --cwd apps/desktop test:internal
      # Native macOS filesystem coverage; no platform stubs and no writes to runner HOME.
      - name: Connected Vault native filesystem tests
        if: matrix.platform == 'darwin'
        run: |
          vault_test_root=$(mktemp -d "$RUNNER_TEMP/clawdi-vault-tests.XXXXXX")
          trap 'rm -rf "$vault_test_root"' EXIT
          mkdir -p "$vault_test_root/home" "$vault_test_root/state" "$vault_test_root/tmp"
          HOME="$vault_test_root/home" CLAWDI_HOME="$vault_test_root/state" \
            CLAWDI_STATE_DIR="$vault_test_root/state/serve" TMPDIR="$vault_test_root/tmp" \
            CLAWDI_NO_AUTO_UPDATE=1 CLAWDI_NO_UPDATE_CHECK=1 \
            bun run --cwd packages/cli test:internal src/runtime/vault-files.test.ts \
              src/serve/vault-sync.test.ts src/lib/environment-registration.test.ts
      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm xvfb libgtk-3-0 libnss3 libasound2t64
      - name: Build native package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_FOR_PULL_REQUEST: 'true'
        run: bun run --cwd apps/desktop scripts/package-preview.ts
      - name: Verify embedded runtime
        env:
          TARGET: ${{ matrix.platform }}-${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/desktop-check/home" "$RUNNER_TEMP/desktop-check/state"
          HOME="$RUNNER_TEMP/desktop-check/home" CLAWDI_HOME="$RUNNER_TEMP/desktop-check/state" \
            apps/desktop/resources/native/clawdi update --native-identity | grep -F "$TARGET"
          HOME="$RUNNER_TEMP/desktop-check/home" CLAWDI_HOME="$RUNNER_TEMP/desktop-check/state" \
            apps/desktop/resources/native/clawdi auth status --json
      - name: Check Linux installed application
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get install -y ./apps/desktop/release/*.deb
          test -x /opt/Clawdi/resources/native/clawdi
          test -x /opt/Clawdi/clawdi-desktop
          xvfb-run -a node apps/desktop/scripts/smoke-packaged.mjs \
            /opt/Clawdi/clawdi-desktop "$RUNNER_TEMP/linux-smoke" welcome
      - name: Check Intel Mac application
        if: matrix.platform == 'darwin'
        run: |
          codesign --verify --deep --strict apps/desktop/release/mac/Clawdi.app
          node apps/desktop/scripts/smoke-packaged.mjs \
            "$PWD/apps/desktop/release/mac/Clawdi.app/Contents/MacOS/Clawdi" \
            "$RUNNER_TEMP/intel-smoke" install
      - uses: actions/upload-artifact@v7
        with:
          name: clawdi-${{ matrix.platform }}-${{ matrix.arch }}-preview
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
          if-no-files-found: error
          retention-days: 7
