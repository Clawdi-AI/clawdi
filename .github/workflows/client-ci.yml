name: Client CI

on:
  # Required workflows must start even when all heavy jobs will skip.
  # https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/troubleshooting-required-status-checks#handling-skipped-but-required-checks
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  changes:
    if: github.event_name != 'schedule'
    runs-on: ${{ vars.CI_RUNNER || 'blacksmith-16vcpu-ubuntu-2404' }}
    outputs:
      client: ${{ steps.filter.outputs.mobile == 'true' || steps.filter.outputs.web == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.cli == 'true' || steps.filter.outputs.sidecar == 'true' || steps.filter.outputs.workspace == 'true' }}
      mobile: ${{ steps.filter.outputs.mobile == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.workspace == 'true' }}
      web: ${{ steps.filter.outputs.web == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.workspace == 'true' }}
      shared: ${{ steps.filter.outputs.shared == 'true' || steps.filter.outputs.workspace == 'true' }}
      cli: ${{ steps.filter.outputs.cli == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.workspace == 'true' }}
      sidecar: ${{ steps.filter.outputs.sidecar == 'true' || steps.filter.outputs.workspace == 'true' }}
      web_e2e: ${{ steps.filter.outputs.web == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.workspace == 'true' }}
      deploy_contract: ${{ steps.filter.outputs.deploy_contract }}
      whatsapp_native_e2e: ${{ steps.filter.outputs.whatsapp_native_e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # Standard job routing: https://github.com/dorny/paths-filter#conditional-execution
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # Use the exact event endpoints so path routing stays on the bounded
          # git fallback instead of the pull-request files API.
          token: ""
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          ref: ${{ github.event_name == 'push' && github.sha || '' }}
          filters: |
            mobile:
              - "apps/mobile/**"
              - ".github/workflows/mobile-release.yml"
            web:
              - "apps/web/**"
            shared:
              - "packages/shared/**"
            cli:
              - "packages/cli/**"
              - "install.sh"
            sidecar:
              - "packages/whatsapp-baileys-sidecar/**"
              - "patches/libsignal@6.0.0.patch"
            workspace:
              - "package.json"
              - "bun.lock"
              - "turbo.json"
              - "tsconfig.base.json"
              - "biome.json"
              - ".github/actions/setup-bun-ci/**"
              - ".github/workflows/client-ci.yml"
            deploy_contract:
              - "packages/shared/src/api/deploy.generated.ts"
              - "scripts/filter-deploy-openapi.py"
              - "scripts/openapi-typescript.sh"
              - "scripts/generate-deploy-api.sh"
              - "scripts/check-deploy-generated-api.sh"
              - "apps/web/package.json"
              - ".github/workflows/client-ci.yml"
            # The stock-runtime capture also feeds the real PostgreSQL outbox
            # through the official backend runner; include that stage's inputs.
            whatsapp_native_e2e:
              - "backend/tests/*whatsapp*.py"
              - "backend/tests/conftest.py"
              - "backend/app/services/channels.py"
              - "backend/app/models/channel.py"
              - "scripts/test.sh"
              - "docker-compose.test.yml"
              - "docker/test-runner.Dockerfile"
              - "config/postgres-image.txt"
              - "backend/app/services/whatsapp_provider_bridge.py"
              - "backend/pyproject.toml"
              - "backend/uv.lock"
              - "backend/app/services/whatsapp_baileys.py"
              - "backend/app/services/whatsapp_noise.py"
              - "backend/app/services/whatsapp_runtime_types.py"
              - "backend/app/services/whatsapp_wabinary_tokens.py"
              - "packages/cli/egress-addon/**"
              - "packages/cli/package.json"
              - "packages/cli/src/runtime/channels.ts"
              - "packages/cli/src/runtime/egress-*.ts"
              - "packages/cli/src/runtime/managed-baileys-compat.ts"
              - "packages/cli/src/runtime/manifest.ts"
              - "packages/cli/src/runtime/transparent-egress.ts"
              - "packages/cli/src/runtime/whatsapp-*.ts"
              - "packages/cli/tests/fixtures/managed-whatsapp-native-e2e/**"
              - "packages/shared/package.json"
              - "scripts/test-managed-whatsapp-native-e2e.sh"
              - ".dockerignore"
              - "package.json"
              - "bun.lock"
              - "patches/libsignal@6.0.0.patch"
              - ".github/workflows/client-ci.yml"
              - ".github/actions/setup-docker-hub-mirror/**"

  # Keep current package coverage: Turbo --affected bun.lock routing is unverified.
  # https://turborepo.com/docs/reference/run#--affected
  # Route package work through the actual
  # workspace dependency edges. Shared changes fan out to Web and CLI.
  verify:
    needs: changes
    if: >-
      github.event_name != 'schedule' &&
      needs.changes.outputs.client == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    env:
      # Required for web typecheck/build — CI doesn't need real values
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_dummy
      VITE_CLAWDI_API_URL: http://localhost:8000
      CLERK_SECRET_KEY: sk_test_dummy
      RUN_WEB: ${{ needs.changes.outputs.web }}
      RUN_MOBILE: ${{ needs.changes.outputs.mobile }}
      RUN_SHARED: ${{ needs.changes.outputs.shared }}
      RUN_CLI: ${{ needs.changes.outputs.cli }}
      RUN_SIDECAR: ${{ needs.changes.outputs.sidecar }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-ci
      - name: Biome check
        run: bun run check
      - name: Typecheck and build
        run: |
          filters=()
          [[ "$RUN_MOBILE" == "true" ]] && filters+=(--filter=@clawdi/mobile)
          [[ "$RUN_WEB" == "true" ]] && filters+=(--filter=web)
          [[ "$RUN_SHARED" == "true" ]] && filters+=(--filter=@clawdi/shared)
          [[ "$RUN_CLI" == "true" ]] && filters+=(--filter=clawdi)
          [[ "$RUN_SIDECAR" == "true" ]] && filters+=(--filter=@clawdi/whatsapp-baileys-sidecar)
          if (( ${#filters[@]} == 0 )); then
            echo "Client CI routed no packages" >&2
            exit 2
          fi
          bunx turbo typecheck build "${filters[@]}" --output-logs=errors-only
      - name: Production SSR public routes
        if: needs.changes.outputs.web == 'true'
        run: bun run --cwd apps/web test:ssr:internal
      - name: Set up native Agent test dependencies
        if: needs.changes.outputs.cli == 'true'
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.5"
          python-version: "3.12"
      # Smoke tests exercise the compiled bin wrapper, built above by Turbo.
      - name: Build native CLI
        if: needs.changes.outputs.cli == 'true'
        run: bun run --cwd packages/cli build:native
      - name: Validate CLI publish payload
        if: needs.changes.outputs.cli == 'true'
        run: bun run --cwd packages/cli check:publish-manifest
      - name: Test routed client packages
        run: |
          package_dirs=()
          [[ "$RUN_MOBILE" == "true" ]] && package_dirs+=(apps/mobile)
          [[ "$RUN_WEB" == "true" ]] && package_dirs+=(apps/web)
          [[ "$RUN_SHARED" == "true" ]] && package_dirs+=(packages/shared)
          [[ "$RUN_SIDECAR" == "true" ]] && package_dirs+=(packages/whatsapp-baileys-sidecar)
          [[ "$RUN_CLI" == "true" ]] && package_dirs+=(packages/cli)

          test_packages() {
            set -e
            local package_dir
            for package_dir in "${package_dirs[@]}"; do
              printf '\n==> Tests: %s\n' "$package_dir"
              bun run --cwd "$package_dir" test:internal
            done
          }

          if [[ "$RUN_CLI" != "true" ]]; then
            test_packages
            exit
          fi

          (
            set -e
            printf '\n==> Native CLI lifecycle\n'
            sh -n install.sh
            packages/cli/dist-native/linux-x64/clawdi --version
            bun run --cwd packages/cli test:native-linux-lifecycle:internal
          ) &
          native_pid=$!
          test_packages &
          packages_pid=$!

          native_status=0
          packages_status=0
          wait "$native_pid" || native_status=$?
          wait "$packages_pid" || packages_status=$?
          if (( native_status != 0 || packages_status != 0 )); then
            exit 1
          fi
      - name: Export mobile bundles
        if: needs.changes.outputs.mobile == 'true'
        working-directory: apps/mobile
        run: |
          mobile_exports=$(mktemp -d)
          trap 'rm -rf "$mobile_exports"' EXIT
          bunx expo export --platform ios --output-dir "$mobile_exports/ios"
          bunx expo export --platform android --output-dir "$mobile_exports/android"
      - name: Production mobile bundles exclude development authentication
        if: needs.changes.outputs.mobile == 'true'
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_DEV_AUTH_BYPASS: "1"
          EXPO_PUBLIC_CLAWDI_ENV: production
          EXPO_PUBLIC_CLAWDI_API_URL: https://cloud-api.clawdi.ai
          EXPO_PUBLIC_CLAWDI_COMPUTE_API_URL: https://api.clawdi.ai
          EXPO_PUBLIC_CLAWDI_LINK_HOSTS: cloud.clawdi.ai
        run: |
          mobile_exports=$(mktemp -d)
          trap 'rm -rf "$mobile_exports"' EXIT
          bunx expo export --platform all --no-bytecode --output-dir "$mobile_exports"
          # Match fixture literals; Clerk also ships /dev_browser and dev_browser_unauthenticated.
          if grep -R -a -l -E "[\"'](dev_browser(_session)?|dev-bypass|avery@clawdi\.dev)[\"']" "$mobile_exports"; then
            echo 'Production export contains development authentication fixtures' >&2
            exit 1
          else
            status=$?
            [[ "$status" == 1 ]] || exit "$status"
          fi

  deploy-contract-drift:
    needs: changes
    if: >-
      github.event_name != 'schedule' &&
      needs.changes.outputs.deploy_contract == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-ci
      - name: Hosted deploy contract matches live spec
        env:
          DEPLOY_OPENAPI_SOURCE: https://api.clawdi.ai/openapi.json
          DEPLOY_CONTRACT_FETCH_MODE: warn
        run: scripts/check-deploy-generated-api.sh

  web-e2e:
    needs: changes
    if: >-
      github.event_name != 'schedule' &&
      needs.changes.outputs.web_e2e == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 25
    env:
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_dummy
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-ci
      - name: Install Chromium for Playwright
        # Run from apps/web so bunx resolves the workspace-pinned playwright.
        # At the repo root the bin is absent and bunx silently downloads the
        # latest release, installing browsers the pinned @playwright/test
        # version then can't find.
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium
      - name: Auth route lifecycle contracts
        run: bun run --cwd apps/web e2e --config=playwright.auth.config.ts
      - name: OSS web e2e
        run: bun run --cwd apps/web e2e
      - name: Set up Hosted browser fixture dependencies
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.5"
          python-version: "3.12"
      - name: Install Hosted browser fixture dependencies
        run: uv sync --project backend --frozen
      - name: Hosted provider flows
        run: >-
          bun run --cwd apps/web e2e --config=playwright.hosted.config.ts
          e2e/hosted-deploy-flow.pw.ts e2e/hosted-smoke.pw.ts e2e/hosted-billing.pw.ts
          e2e/hosted-openclaw.pw.ts e2e/hosted-channels.pw.ts e2e/hosted-rail-nav.pw.ts
          e2e/hosted-channels-providers.pw.ts e2e/hosted-overview-hydration.pw.ts
          --grep "deploy wizard creates|cold load hydrates without a mismatch|Clawdi AI model selection|provider creation stays|Custom model ownership|renaming a native|editing and rotating an agent-owned|popular BYOK|native BYOK saves"

  whatsapp-native-e2e:
    needs: changes
    # The daily schedule catches pinned upstream/runtime drift.
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
      needs.changes.outputs.whatsapp_native_e2e == 'true')
    runs-on: ${{ vars.CI_RUNNER || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Hub mirror
        id: docker-hub-mirror
        uses: ./.github/actions/setup-docker-hub-mirror
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          prefetch-images: |
            moby/buildkit:buildx-stable-1
      - name: Check Docker availability
        run: docker version
      - name: Restore pinned upstream artifacts
        id: upstream-artifacts
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/managed-whatsapp-native-e2e-artifacts
          key: managed-whatsapp-native-e2e-artifacts-v1-${{ hashFiles('packages/cli/tests/fixtures/managed-whatsapp-native-e2e/versions.env') }}
      - name: Fetch and verify pinned upstream artifacts
        env:
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/managed-whatsapp-native-e2e-artifacts
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/test-managed-whatsapp-native-e2e.sh --fetch-only
      - name: Save pinned upstream artifacts
        if: steps.upstream-artifacts.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/managed-whatsapp-native-e2e-artifacts
          key: managed-whatsapp-native-e2e-artifacts-v1-${{ hashFiles('packages/cli/tests/fixtures/managed-whatsapp-native-e2e/versions.env') }}
      - name: Build stock OpenClaw and Hermes WhatsApp E2E images
        uses: docker/bake-action@v7
        env:
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/managed-whatsapp-native-e2e-artifacts
        with:
          source: .
          files: packages/cli/tests/fixtures/managed-whatsapp-native-e2e/docker-bake.hcl
          targets: openclaw,hermes
          load: true
          set: |
            openclaw.cache-from=type=gha,scope=managed-whatsapp-native-e2e-openclaw
            openclaw.cache-to=type=gha,mode=max,scope=managed-whatsapp-native-e2e-openclaw
            hermes.cache-from=type=gha,scope=managed-whatsapp-native-e2e-hermes
            hermes.cache-to=type=gha,mode=max,scope=managed-whatsapp-native-e2e-hermes
      - name: Test stock OpenClaw and Hermes WhatsApp plugins
        run: scripts/test-managed-whatsapp-native-e2e.sh --run-only
      - name: Remove loaded E2E images
        if: always()
        run: >-
          docker image rm
          clawdi-managed-whatsapp-native-e2e:openclaw-local
          clawdi-managed-whatsapp-native-e2e:hermes-local
          2>/dev/null || true

  deploy-contract-drift-daily:
    if: github.event_name == 'schedule'
    runs-on: ${{ vars.CI_RUNNER || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-ci
      - name: Hosted deploy contract matches live spec (strict)
        env:
          DEPLOY_OPENAPI_SOURCE: https://api.clawdi.ai/openapi.json
          DEPLOY_CONTRACT_FETCH_MODE: strict
        run: scripts/check-deploy-generated-api.sh

  # Aggregate skipped/successful lanes into a stable required check.
  # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idneeds
  # https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#always
  ci-ok:
    name: Client CI OK
    needs: [changes, verify, deploy-contract-drift, web-e2e, whatsapp-native-e2e, deploy-contract-drift-daily]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Reject failed or cancelled jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Required jobs passed or skipped
        run: echo "All required jobs passed or were skipped by change detection."
