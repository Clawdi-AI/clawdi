name: Client CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "packages/cli/**"
      - "install.sh"
      - "scripts/filter-deploy-openapi.py"
      - "scripts/openapi-typescript.sh"
      - "scripts/generate-deploy-api.sh"
      - "scripts/check-deploy-generated-api.sh"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - "tsconfig.base.json"
      - "biome.json"
      - ".github/actions/setup-bun-ci/**"
      - ".github/workflows/client-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "packages/cli/**"
      - "install.sh"
      - "scripts/filter-deploy-openapi.py"
      - "scripts/openapi-typescript.sh"
      - "scripts/generate-deploy-api.sh"
      - "scripts/check-deploy-generated-api.sh"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - "tsconfig.base.json"
      - "biome.json"
      - ".github/actions/setup-bun-ci/**"
      - ".github/workflows/client-ci.yml"
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: client-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  changes:
    if: github.event_name != 'schedule'
    runs-on: ${{ vars.CI_RUNNER || 'blacksmith-16vcpu-ubuntu-2404' }}
    outputs:
      web: ${{ steps.filter.outputs.web }}
      cli: ${{ steps.filter.outputs.cli }}
      shared: ${{ steps.filter.outputs.shared }}
      infra: ${{ steps.filter.outputs.infra }}
      deploy_contract: ${{ steps.filter.outputs.deploy_contract }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            web:
              - "apps/web/**"
            cli:
              - "packages/cli/**"
              - "install.sh"
            shared:
              - "packages/shared/**"
            infra:
              - "package.json"
              - "bun.lock"
              - "turbo.json"
              - "tsconfig.base.json"
              - "biome.json"
              - ".github/actions/setup-bun-ci/**"
              - ".github/workflows/client-ci.yml"
            deploy_contract:
              - "packages/shared/src/api/deploy.generated.ts"
              - "scripts/filter-deploy-openapi.py"
              - "scripts/openapi-typescript.sh"
              - "scripts/generate-deploy-api.sh"
              - "scripts/check-deploy-generated-api.sh"
              - "apps/web/package.json"
              - ".github/workflows/client-ci.yml"

  # Lint, typecheck, build, and CLI tests in one job.
  #
  # These are seconds of work each (Biome ~2s, each typecheck 1-4s, web build
  # ~6s). Splitting them across five jobs plus a matrix meant paying job setup
  # five times and holding five runner slots for ~35s of actual work, which is
  # what drove this workflow's queueing. Turbo already resolves the task graph
  # and skips unaffected packages, so the per-target guard logic these jobs
  # carried was redundant with it.
  verify:
    needs: changes
    if: >-
      github.event_name != 'schedule' && (
        needs.changes.outputs.web == 'true' ||
        needs.changes.outputs.cli == 'true' ||
        needs.changes.outputs.shared == 'true' ||
        needs.changes.outputs.infra == 'true'
      )
    runs-on: ${{ vars.CI_RUNNER || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 20
    env:
      # Required for web typecheck/build — CI doesn't need real values
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_dummy
      VITE_CLAWDI_API_URL: http://localhost:8000
      CLERK_SECRET_KEY: sk_test_dummy
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun-ci
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Biome check
        run: bun run check
      - name: Typecheck and build
        run: >-
          bunx turbo typecheck build
          --filter=web --filter=clawdi --filter=@clawdi/shared
          --output-logs=errors-only
      # Smoke tests exercise the compiled bin wrapper, built above by Turbo.
      - name: Build native CLI
        run: bun run --cwd packages/cli build:native
      - name: Smoke native CLI
        run: |
          sh -n install.sh
          packages/cli/dist-native/linux-x64/clawdi --version
          CLAWDI_NATIVE_BINARY=packages/cli/dist-native/linux-x64/clawdi \
            bun test \
              packages/cli/tests/e2e/native-installer.e2e.test.ts \
              packages/cli/tests/e2e/native-daemon.e2e.test.ts
      - name: Validate CLI publish payload
        run: bun run --cwd packages/cli check:publish-manifest
      - name: Test CLI
        run: bun test --isolate --max-concurrency=1 packages/cli

  deploy-contract-drift:
    needs: changes
    if: >-
      github.event_name != 'schedule' &&
      needs.changes.outputs.deploy_contract == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun-ci
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Hosted deploy contract matches live spec
        env:
          DEPLOY_OPENAPI_SOURCE: https://api.clawdi.ai/openapi.json
          DEPLOY_CONTRACT_FETCH_MODE: warn
        run: scripts/check-deploy-generated-api.sh

  deploy-contract-drift-daily:
    if: github.event_name == 'schedule'
    runs-on: ${{ vars.CI_RUNNER || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun-ci
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Hosted deploy contract matches live spec (strict)
        env:
          DEPLOY_OPENAPI_SOURCE: https://api.clawdi.ai/openapi.json
          DEPLOY_CONTRACT_FETCH_MODE: strict
        run: scripts/check-deploy-generated-api.sh
