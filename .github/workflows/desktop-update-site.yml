name: Desktop Update Site

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: desktop-update-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-ci
      - uses: actions/configure-pages@v5
      - name: Prepare both Desktop update channels
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun apps/desktop/scripts/prepare-update-site.ts "$RUNNER_TEMP/desktop-site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/desktop-site
      - name: Deploy update metadata
        id: deployment
        uses: actions/deploy-pages@v4
