name: Desktop Update Site

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: desktop-update-site
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'desktop-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-ci
      - uses: actions/configure-pages@v6
        id: pages
      - name: Prepare both Desktop update channels
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_PAUSED_VERSIONS: ${{ vars.DESKTOP_PAUSED_VERSIONS }}
          DESKTOP_UPDATE_SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: bun apps/desktop/scripts/prepare-update-site.ts "$RUNNER_TEMP/desktop-site"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/desktop-site
      - name: Deploy update metadata
        id: deployment
        uses: actions/deploy-pages@v5
