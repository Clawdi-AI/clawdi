name: Mobile release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build a production binary or publish an OTA update
        type: choice
        options: [build, update]
        default: build
        required: true
      platform:
        description: Platform to build
        type: choice
        options: [android, ios, all]
        default: all
        required: true
      auto_submit:
        description: Submit completed builds using the production submit profile
        type: boolean
        default: false
        required: true
      channel:
        description: Update channel and EAS environment (update only)
        type: choice
        options: [preview, production]
        default: preview
        required: true
      message:
        description: Update description (required for update)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  preflight:
    environment: production
    runs-on: ${{ vars.CI_RUNNER || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - name: Require main or a mobile release tag
        run: |
          case "$GITHUB_REF" in
            refs/heads/main|refs/tags/mobile-v*) ;;
            *) echo "::error::Mobile releases require main or a mobile-v* tag."; exit 1 ;;
          esac
      - uses: actions/checkout@v7
      - name: Require Expo release configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "::error::Configure EXPO_TOKEN in the production GitHub Environment before dispatching a mobile release."
            exit 1
          fi
          if [[ -z "$EAS_PROJECT_ID" ]]; then
            echo "::error::Configure the EAS_PROJECT_ID repository variable before dispatching a mobile release."
            exit 1
          fi
      - name: Validate release inputs and iOS submission configuration
        env:
          OPERATION: ${{ inputs.operation }}
          PLATFORM: ${{ inputs.platform }}
          AUTO_SUBMIT: ${{ inputs.auto_submit }}
          CHANNEL: ${{ inputs.channel }}
          UPDATE_MESSAGE: ${{ inputs.message }}
        run: |
          case "$OPERATION" in
            build)
              case "$PLATFORM" in
                android|ios|all) ;;
                *) echo "::error::Invalid platform"; exit 1 ;;
              esac
              if [[ "$AUTO_SUBMIT" == true && "$PLATFORM" != android ]]; then
                if ! jq -e '.submit.production.ios.ascAppId | strings | select(test("^[0-9]+$") and length <= 30)' apps/mobile/eas.json >/dev/null; then
                  echo "::error::iOS auto-submit requires the owner's numeric App Store Connect app ID in apps/mobile/eas.json at submit.production.ios.ascAppId. Commit that non-secret value before enabling auto-submit."
                  exit 1
                fi
              fi
              ;;
            update)
              case "$CHANNEL" in
                preview|production) ;;
                *) echo "::error::Invalid update channel"; exit 1 ;;
              esac
              if [[ ! "$UPDATE_MESSAGE" =~ [^[:space:]] ]]; then
                echo "::error::An update description is required."
                exit 1
              fi
              ;;
            *) echo "::error::Invalid release operation"; exit 1 ;;
          esac

      - name: Require Sentry Update upload configuration
        if: inputs.operation == 'update'
        env:
          SENTRY_UPLOAD_CONFIGURED: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if [[ "$SENTRY_UPLOAD_CONFIGURED" == true ]]; then
            if [[ -z "$SENTRY_ORG" || -z "$SENTRY_PROJECT" ]]; then
              echo "::error::Configure SENTRY_ORG and SENTRY_PROJECT in the production GitHub Environment before publishing an update with SENTRY_AUTH_TOKEN."
              exit 1
            fi
          fi

  verify-mobile:
    needs: preflight
    runs-on: ${{ vars.CI_RUNNER || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-ci
        with:
          node-version: "24.21.0"
      - name: Biome check
        run: bun run check
      - name: Mobile typecheck
        run: bun run --cwd apps/mobile typecheck
      - name: Mobile tests
        run: bun run --cwd apps/mobile test:internal
      - name: Export mobile bundles
        working-directory: apps/mobile
        run: |
          mobile_exports=$(mktemp -d)
          trap 'rm -rf "$mobile_exports"' EXIT
          bunx expo export --platform ios --output-dir "$mobile_exports/ios"
          bunx expo export --platform android --output-dir "$mobile_exports/android"
      - name: Production mobile bundles exclude development authentication
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_DEV_AUTH_BYPASS: "1"
          EXPO_PUBLIC_CLAWDI_ENV: production
          EXPO_PUBLIC_CLAWDI_API_URL: https://cloud-api.clawdi.ai
          EXPO_PUBLIC_CLAWDI_COMPUTE_API_URL: https://api.clawdi.ai
          EXPO_PUBLIC_CLAWDI_LINK_HOSTS: cloud.clawdi.ai
        run: |
          mobile_exports=$(mktemp -d)
          trap 'rm -rf "$mobile_exports"' EXIT
          bunx expo export --platform all --no-bytecode --output-dir "$mobile_exports"
          # Match fixture literals; Clerk also ships /dev_browser and dev_browser_unauthenticated.
          if grep -R -a -l -E "[\"'](dev_browser(_session)?|dev-bypass|avery@clawdi\.dev)[\"']" "$mobile_exports"; then
            echo 'Production export contains development authentication fixtures' >&2
            exit 1
          else
            status=$?
            [[ "$status" == 1 ]] || exit "$status"
          fi

  build:
    needs: verify-mobile
    if: inputs.operation == 'build'
    environment: production
    runs-on: ${{ vars.CI_RUNNER || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-ci
        with:
          node-version: "24.21.0"
      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: 24.8.0
          packager: bun
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build production app
        working-directory: apps/mobile
        env:
          PLATFORM: ${{ inputs.platform }}
          AUTO_SUBMIT: ${{ inputs.auto_submit }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
        run: |
          case "$PLATFORM" in
            android|ios|all) ;;
            *) echo "::error::Invalid platform"; exit 1 ;;
          esac
          args=(build --profile production --non-interactive --platform "$PLATFORM")
          if [[ "$AUTO_SUBMIT" == true ]]; then
            args+=(--auto-submit)
          fi
          eas "${args[@]}"

  update:
    needs: verify-mobile
    if: inputs.operation == 'update'
    environment: production
    runs-on: ${{ vars.CI_RUNNER || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    env:
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-ci
        with:
          node-version: "24.21.0"
      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: 24.8.0
          packager: bun
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish OTA update
        working-directory: apps/mobile
        env:
          CHANNEL: ${{ inputs.channel }}
          UPDATE_MESSAGE: ${{ inputs.message }}
        run: eas update --channel "$CHANNEL" --environment "$CHANNEL" --non-interactive --message="$UPDATE_MESSAGE"
      - name: Upload Update source maps to Sentry
        working-directory: apps/mobile
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if [[ -z "$SENTRY_AUTH_TOKEN" ]]; then
            echo "::warning::SENTRY_AUTH_TOKEN is unset; skipping Update source map upload."
            exit 0
          fi
          npx sentry-expo-upload-sourcemaps dist
