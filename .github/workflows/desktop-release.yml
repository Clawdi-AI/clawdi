name: Desktop Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  macos-arm64:
    runs-on: macos-latest
    environment: macos-release
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-bun-ci

      - name: Prepare Apple credentials
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in \
            CSC_LINK \
            CSC_KEY_PASSWORD \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER \
            APPLE_API_KEY_P8_BASE64 \
            APPLE_TEAM_ID
          do
            test -n "${!name}" || { echo "Missing macos-release secret: $name" >&2; exit 1; }
          done
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          printf 'APPLE_API_KEY=%s\n' "$key_path" >> "$GITHUB_ENV"

      - name: Verify Desktop
        run: |
          bun run --cwd apps/desktop typecheck
          bun x biome ci apps/desktop packages/shared/src/desktop.ts

      - name: Build, sign, and notarize
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          bun run --cwd apps/desktop build
          CLAWDI_NATIVE_TARGET=darwin-arm64 bun run --cwd apps/desktop prepare:native
          bun x electron-builder \
            --projectDir apps/desktop \
            --mac dmg \
            --arm64

      - name: Verify signed artifact
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app="apps/desktop/release/mac-arm64/Clawdi.app"
          dmg=(apps/desktop/release/Clawdi-*.dmg)
          test -d "$app"
          test "${#dmg[@]}" -eq 1
          codesign --verify --deep --strict --verbose=2 "$app"
          signature=$(codesign --display --verbose=4 "$app" 2>&1)
          grep -F "Authority=Developer ID Application:" <<< "$signature"
          grep -F "TeamIdentifier=$APPLE_TEAM_ID" <<< "$signature"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          shasum -a 256 "${dmg[0]}" > "${dmg[0]}.sha256"

      - name: Smoke test packaged app
        run: |
          dmg=(apps/desktop/release/Clawdi-*.dmg)
          mount="$RUNNER_TEMP/clawdi-dmg"
          runtime_home="$RUNNER_TEMP/clawdi-runtime"
          mkdir -p "$mount" "$runtime_home/home" "$runtime_home/state"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "${dmg[0]}"
          trap 'hdiutil detach "$mount"' EXIT
          ditto "$mount/Clawdi.app" "$runtime_home/Clawdi.app"
          hdiutil detach "$mount"
          trap - EXIT
          node apps/desktop/scripts/smoke-packaged.mjs \
            "$runtime_home/Clawdi.app/Contents/MacOS/Clawdi" \
            "$runtime_home/app"

      - name: Upload signed release
        uses: actions/upload-artifact@v7
        with:
          name: clawdi-macos-arm64-signed
          path: |
            apps/desktop/release/Clawdi-*.dmg
            apps/desktop/release/Clawdi-*.dmg.sha256
          if-no-files-found: error
          retention-days: 14
