# Reusable composite action: set up Bun + install workspace dependencies.
# Used by JS-dependent CI jobs so setup is consistent.
#
# Deliberately uncached: a cold `bun install --frozen-lockfile` for this
# workspace takes ~3s, while restoring the ~1.1GB `~/.bun/install/cache`
# entry took ~100s in every job. The cache also grew without bound —
# `restore-keys` prefix-matched the previous entry, bun appended newly
# resolved versions, and the save wrote back a strictly larger union until
# the repo blew past its cache quota. Do not reintroduce it.
name: Setup Bun CI
description: Install Bun and run `bun install --frozen-lockfile`

inputs:
  node-version:
    description: Node.js version used by package bin scripts during CI
    required: false
    default: "24.x"
  bun-version:
    description: Optional Bun version override (defaults to the root packageManager)
    required: false
  windows-filters:
    description: Optional space-separated workspace filters for Windows installs (Bun --filter)
    required: false

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}
        bun-version-file: package.json

    - name: Install dependencies
      if: runner.os != 'Windows'
      shell: bash
      run: bun install --frozen-lockfile

    - name: Install dependencies on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        BUN_INSTALL_FILTERS: ${{ inputs.windows-filters }}
      # https://bun.com/docs/pm/filter#bun-install-and-bun-outdated
      run: |
        $installArgs = @('install', '--frozen-lockfile')
        foreach ($filter in ($env:BUN_INSTALL_FILTERS -split '\s+')) {
          if ($filter) { $installArgs += @('--filter', $filter) }
        }
        bun @installArgs
