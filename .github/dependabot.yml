# Dependabot configuration — weekly dependency bumps.
# Groups minor/patch updates into one PR per ecosystem to keep noise low.

version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # TanStack Router/Start ship API changes in minors; keep them out of the
      # broad group so a TanStack break does not block unrelated updates.
      tanstack:
        patterns: ["@tanstack/*"]
        update-types: ["minor", "patch"]
      minor-and-patch:
        update-types: ["minor", "patch"]
        # Dependabot ranks a pattern-less group as more specific, so the
        # TanStack packages must be excluded here explicitly.
        exclude-patterns: ["@tanstack/*"]
    ignore:
      # Majors come through a human-owned upgrade PR.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Exact pins owned by humans: mem0ai is locked by the pinned public-client
      # contract, and composio/composio-client are a published pair.
      - dependency-name: "mem0ai"
      # The boto stack is pinned to the newest patch that every distribution
      # (including botocore-stubs) has published; BOTO_VERSION in
      # tests/test_boto_dependency_alignment.py must move with it.
      - dependency-name: "boto3"
      - dependency-name: "botocore"
      - dependency-name: "boto3-stubs"
      - dependency-name: "boto3-stubs-full"
      - dependency-name: "botocore-stubs"
      # EXPECTED_VERSION in scripts/type_governance.py pins the analyzer.
      - dependency-name: "basedpyright"
      - dependency-name: "composio"
      - dependency-name: "composio-client"
      # SQLAlchemy 2.1 switches the default PostgreSQL driver to psycopg 3;
      # that migration needs a human-owned PR.
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
