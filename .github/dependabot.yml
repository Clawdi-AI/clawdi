# Dependabot configuration — weekly dependency bumps.
# Groups minor/patch updates into one PR per ecosystem to keep noise low.

version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # TanStack Router/Start ship API changes in minors; keep them out of the
      # broad group so a TanStack break does not block unrelated updates.
      tanstack:
        patterns: ["@tanstack/*"]
        update-types: ["minor", "patch"]
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Majors come through a human-owned upgrade PR.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      # boto3, botocore and their stubs are pinned to one exact patch
      # (tests/test_boto_dependency_alignment.py), so they must move together.
      aws-sdk:
        patterns: ["boto3", "botocore", "s3transfer", "boto3-stubs", "boto3-stubs-full", "botocore-stubs"]
        update-types: ["minor", "patch"]
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Exact pins owned by humans: mem0ai is locked by the pinned public-client
      # contract, and composio/composio-client are a published pair.
      - dependency-name: "mem0ai"
      - dependency-name: "composio"
      - dependency-name: "composio-client"
      # SQLAlchemy 2.1 switches the default PostgreSQL driver to psycopg 3;
      # that migration needs a human-owned PR.
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
