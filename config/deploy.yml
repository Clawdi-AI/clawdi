<%
require "json"
require "pathname"

whatsapp_manifest_path = File.expand_path(".kamal/whatsapp-sidecars.json", Dir.pwd)
whatsapp_manifest = if File.exist?(whatsapp_manifest_path)
  JSON.parse(File.read(whatsapp_manifest_path))
else
  { "schema_version" => 1, "accounts" => [] }
end
unless whatsapp_manifest == { "schema_version" => 1, "accounts" => whatsapp_manifest["accounts"] } && whatsapp_manifest["accounts"].is_a?(Array)
  raise "invalid generated WhatsApp sidecar deployment manifest"
end
whatsapp_accounts = whatsapp_manifest.fetch("accounts")
whatsapp_account_ids = []
whatsapp_accounts.each do |account|
  unless account.is_a?(Hash) && account.keys.sort == %w[accessory_name account_id socket_path token_secret_name]
    raise "invalid generated WhatsApp sidecar account entry"
  end
  account_id = account.fetch("account_id")
  unless account_id.is_a?(String) && account_id.match?(/\A[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\z/)
    raise "invalid generated WhatsApp sidecar account id"
  end
  compact_id = account_id.delete("-")
  unless account.fetch("accessory_name") == "whatsapp-baileys-#{compact_id}" &&
      account.fetch("socket_path") == "/run/clawdi-whatsapp/#{account_id}/sidecar.sock" &&
      account.fetch("token_secret_name") == "CLAWDI_WA_SIDECAR_TOKEN_#{compact_id.upcase}"
    raise "invalid generated WhatsApp sidecar account identity"
  end
  whatsapp_account_ids << account_id
end
unless whatsapp_account_ids.uniq.length == whatsapp_account_ids.length
  raise "duplicate generated WhatsApp sidecar account id"
end
whatsapp_host_root = ENV.fetch("WHATSAPP_BAILEYS_HOST_ROOT", "").strip
sidecar_image_version = ENV.fetch("DEPLOY_IMAGE_VERSION", "").strip
if whatsapp_accounts.any?
  unless whatsapp_host_root != "/" && whatsapp_host_root.match?(/\A\/[A-Za-z0-9._\/-]+\z/) &&
      Pathname.new(whatsapp_host_root).absolute? && Pathname.new(whatsapp_host_root).cleanpath.to_s == whatsapp_host_root
    raise "WHATSAPP_BAILEYS_HOST_ROOT must be a safe absolute normalized non-root path"
  end
  unless sidecar_image_version.match?(/\A[0-9a-f]{40}\z/)
    raise "DEPLOY_IMAGE_VERSION must be a full lowercase git SHA when WhatsApp sidecars are configured"
  end
end
%>
# Kamal deployment for the clawdi backend (cloud-api.clawdi.ai).
#
# Images are built and pushed to GHCR by CI; Kamal never builds.
# Deploy a released image with:
#
#   kamal deploy -P --version=<full-git-sha>
#
# Secrets live in .kamal/secrets (gitignored, operator-local). Non-secret
# runtime shape lives here. The image entrypoint (app.runtime_entrypoint)
# selects the process via CLAWDI_PROCESS_ROLE, runs migrations for the api
# role, and drains on SIGTERM — no command overrides needed.

service: clawdi
image: clawdi-ai/clawdi-backend

minimum_version: 2.12.0

# Rotate container logs on the host (kamal default is 10m x 1 file).
logging:
  options:
    max-size: 100m
    max-file: "3"

# Operator shorthands: `kamal console`, `kamal watch`, `kamal psql`.
aliases:
  console: app exec -i --reuse "bash"
  watch: app logs -f
  psql: accessory exec postgres -i "psql -U clawdi clawdi"

ssh:
  user: phala
  # Self-hosters connect directly unless they provide a proxy command.
<% if ENV["DEPLOY_SSH_PROXY_COMMAND"].to_s.strip != "" %>
  proxy_command: <%= ENV["DEPLOY_SSH_PROXY_COMMAND"] %>
<% end %>
  keys:
    - ~/.ssh/clawdi_access_ed25519

registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

servers:
  web:
    hosts:
      - <%= ENV.fetch("DEPLOY_HOST") %>
    options:
      memory: 4g # embedding model (~1.6G resident) + launch-load headroom
      ulimit: nofile=65536:65536 # long-lived SSE/WebSocket connections
      # tini as PID 1 reaps orphaned subprocesses (zombie prevention).
      init: true
  channels-worker:
    hosts:
      - <%= ENV.fetch("DEPLOY_HOST") %>
    proxy: false
    options:
      memory: 2g # grows with connected channel accounts
      init: true
      ulimit: nofile=65536:65536 # per-account gateway sockets
    env:
      clear:
        CLAWDI_PROCESS_ROLE: channels-worker

proxy:
  hosts:
    - cloud-api.clawdi.ai
  app_port: 8000
  # All traffic stays behind Cloudflare (orange cloud). TLS between Cloudflare
  # and this origin uses a Cloudflare Origin CA wildcard cert — no ACME.
  ssl:
    certificate_pem: CLOUDFLARE_ORIGIN_CERT
    private_key_pem: CLOUDFLARE_ORIGIN_KEY
  forward_headers: true # preserve Cloudflare's X-Forwarded-* chain
  # SSE surfaces (sync, channel streams, MCP bridge): response buffering
  # delays or breaks event streams through kamal-proxy.
  buffering:
    responses: false
  healthcheck:
    path: /health
    interval: 5
    timeout: 5

deploy_timeout: 120 # api entrypoint runs alembic before listening

volumes:
  - clawdi-fastembed:/tmp/fastembed_cache # fastembed default cache; persists the ~1.1GB ONNX model across deploys
<% whatsapp_accounts.each do |account| %>
  - <%= whatsapp_host_root %>/<%= account.fetch("account_id") %>/run:<%= File.dirname(account.fetch("socket_path")) %>:ro
<% end %>

accessories:
<% whatsapp_accounts.each do |account| %>
  <%= account.fetch("accessory_name") %>:
    image: ghcr.io/clawdi-ai/clawdi-whatsapp-baileys-sidecar:<%= sidecar_image_version %>
    host: <%= ENV.fetch("DEPLOY_HOST") %>
    network: bridge
    directories:
      - local: <%= whatsapp_host_root %>/<%= account.fetch("account_id") %>/state
        remote: /data
        mode: "700"
      - local: <%= whatsapp_host_root %>/<%= account.fetch("account_id") %>/run
        remote: <%= File.dirname(account.fetch("socket_path")) %>
        mode: "770"
    options:
      memory: 512m
      pids-limit: 128
      read-only: true
      cap-drop: ALL
      security-opt: no-new-privileges:true
      tmpfs: /tmp:rw,noexec,nosuid,nodev,size=16m
    env:
      clear:
        CLAWDI_WA_PROVIDER_ACCOUNT_ID: <%= account.fetch("account_id") %>
        CLAWDI_WA_SIDECAR_SESSION_DIR: /data
        CLAWDI_WA_SIDECAR_SOCKET_PATH: <%= account.fetch("socket_path") %>
        CLAWDI_WA_SIDECAR_LOG_LEVEL: info
      secret:
        - CLAWDI_WA_SIDECAR_TOKEN:<%= account.fetch("token_secret_name") %>

<% end %>
  postgres:
    image: ghcr.io/clawdi-ai/postgres-pgbackrest:pg18 # pgvector pg18 + pgBackRest (WAL archiving to R2)
    host: <%= ENV.fetch("DEPLOY_HOST") %>
    options:
      ulimit: nofile=65536:65536
    # 512MB buffers (default 128MB is tiny for 16G host); idle-in-transaction
    # timeout guards against the connection-pile-up-behind-locks failure mode.
    cmd: >-
      postgres -c shared_buffers=512MB -c idle_in_transaction_session_timeout=300s
      -c archive_mode=on
      -c 'archive_command=pgbackrest --stanza=$STANZA archive-push %p'
      -c archive_timeout=60
    directories:
      - data:/var/lib/postgresql # pg18 image layout: PGDATA lives under a version subdir
      - socket:/var/run/postgresql # shared with the backup scheduler sidecar
    env:
      clear:
        <<: &pgbackrest-env
          STANZA: clawdi
          PGBACKREST_STANZA: clawdi
          PGBACKREST_PG1_PATH: /var/lib/postgresql/18/docker
          PGBACKREST_PG1_SOCKET_PATH: /var/run/postgresql
          PGBACKREST_REPO1_TYPE: s3
          PGBACKREST_REPO1_S3_REGION: auto
          PGBACKREST_REPO1_S3_URI_STYLE: path
          PGBACKREST_REPO1_RETENTION_FULL: "2"
          PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
          PGBACKREST_COMPRESS_TYPE: zst
        POSTGRES_DB: clawdi
        POSTGRES_USER: clawdi
      secret:
        - POSTGRES_PASSWORD
        - PGBACKREST_REPO1_PATH
        - PGBACKREST_REPO1_S3_BUCKET
        - PGBACKREST_REPO1_S3_ENDPOINT
        - PGBACKREST_REPO1_S3_KEY
        - PGBACKREST_REPO1_S3_KEY_SECRET
        - PGBACKREST_REPO1_CIPHER_PASS

  postgres-backup:
    # Scheduled pgBackRest runs (Sunday full, daily diff) against the server's
    # shared data and socket volumes. See docs/ops/postgres-backup-restore.md.
    image: ghcr.io/clawdi-ai/postgres-pgbackrest:pg18
    host: <%= ENV.fetch("DEPLOY_HOST") %>
    cmd: gosu postgres supercronic /etc/pgbackrest/backup-cron
    volumes:
      - /home/phala/clawdi-postgres/data:/var/lib/postgresql
      - /home/phala/clawdi-postgres/socket:/var/run/postgresql
    env:
      clear:
        <<: *pgbackrest-env
        PGBACKREST_LOG_LEVEL_CONSOLE: info
      secret:
        - PGBACKREST_REPO1_PATH
        - PGBACKREST_REPO1_S3_BUCKET
        - PGBACKREST_REPO1_S3_ENDPOINT
        - PGBACKREST_REPO1_S3_KEY
        - PGBACKREST_REPO1_S3_KEY_SECRET
        - PGBACKREST_REPO1_CIPHER_PASS

env:
  clear:
    ENVIRONMENT: production
    DEBUG: "false"
    # CI exports GITHUB_SHA; operator deploys without it simply go untagged.
    SENTRY_RELEASE: "<%= ENV.fetch('GITHUB_SHA', '') %>"
    PUBLIC_API_URL: https://cloud-api.clawdi.ai
    WEB_ORIGIN: https://cloud.clawdi.ai
    CORS_ORIGINS: '["https://www.clawdi.ai","https://clawdi.ai","https://api.clawdi.ai","https://cloud.clawdi.ai"]'
    TRUST_FORWARDED_FOR: "true"
    FILE_STORE_TYPE: s3
    MEMORY_EMBEDDING_MODE: local
    DB_POOL_SIZE: 20
    DB_MAX_OVERFLOW: 20
    DB_POOL_TIMEOUT: 45
    FILE_STORE_S3_BUCKET: clawdi
    FILE_STORE_S3_REGION: auto
    FILE_STORE_S3_FORCE_PATH_STYLE: true
    LLM_BASE_URL: 'https://api.redpill.ai/v1'
    LLM_MODEL: gpt-4o-mini
    MEMORY_EMBEDDING_MODEL: text-embedding-3-small
  secret:
    - ADMIN_API_KEY
    - CLERK_JWT_ISSUER
    - SENTRY_DSN
    - CLERK_SECRET_KEY
    - COMPOSIO_API_KEY
    - DATABASE_URL
    - ENCRYPTION_KEY
    - FILE_STORE_S3_ACCESS_KEY_ID
    - FILE_STORE_S3_ENDPOINT_URL
    - FILE_STORE_S3_SECRET_ACCESS_KEY
    - LLM_API_KEY
    - MEMORY_EMBEDDING_API_KEY
    - MEMORY_EMBEDDING_BASE_URL
    - VAULT_ENCRYPTION_KEY
<% if whatsapp_accounts.any? %>
    - CHANNEL_WHATSAPP_BAILEYS_SIDECARS_JSON
<% end %>
